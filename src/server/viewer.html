// ── ask ──────────────────────────────────────────────────
// Lets the user type a question about how the system works; the matching
// elements light up on the canvas the same way a guide step does, and the
// top match's fields open in the sidebar — the "answer" materializes there.
const askInput = document.getElementById('ask-input');
const askSubmit = document.getElementById('ask-submit');
const askPanel = document.getElementById('ask-panel');
let searchActive = false;

function fieldLabel(field) { return t('askField_' + field); }

const SEARCH_MARKS = ['guide-lit', 'guide-cur', 'guide-anc', 'guide-in', 'guide-trail', 'guide-edge', 'guide-flow', 'guide-show', 'guide-arrive'];
function clearPaintMarks() {
  document.querySelectorAll(SEARCH_MARKS.map(m => '#canvas .' + m).join(','))
    .forEach(el => el.classList.remove(...SEARCH_MARKS));
}

function paintSearchResults(results) {
  canvasWrap.classList.add('guiding');
  clearPaintMarks();
  const byCls = cls => document.querySelector(`#canvas [data-cls="${CSS.escape(cls)}"]`);
  // The canvas draws each nested element once: fall back to its nearest drawn ancestor.
  const drawn = cls => {
    for (let segs = cls.split('/'); segs.length; segs.pop()) {
      const el = byCls(segs.join('/'));
      if (el) return el;
    }
    return null;
  };
  results.forEach((r, i) => {
    const el = drawn(r.cls);
    if (!el) return;
    el.classList.add('guide-lit');
    if (i === 0) el.classList.add('guide-cur');
    el.querySelectorAll('.reg-node, .grp-node').forEach(n => n.classList.add('guide-lit'));
    el.querySelectorAll('.edge-path, .edge-label').forEach(n => n.classList.add('guide-in'));
    const segs = r.cls.split('/');
    for (let k = 1; k < segs.length; k++) byCls(segs.slice(0, k).join('/'))?.classList.add('guide-anc');
  });
}

function clearSearch() {
  searchActive = false;
  askPanel.hidden = true;
  if (activeGuide) {
    paintGuideStep();
  } else {
    canvasWrap.classList.remove('guiding');
    clearPaintMarks();
  }
}

// Questions to Claude: only when the server handed this page its token.
const AI = window.__prismeAI === true;
const PAGE_TOKEN = window.__prismeToken || '';
let aiJob = null;

// Claude's state at the top of the panel: working on the question, or why it could not answer.
function askAiBlock() {
  if (!AI || !aiJob) return '';
  if (aiJob.state === 'running')
    return `<div class="ask-ai running"><span class="ask-ai-spin" aria-hidden="true"></span><span class="ask-ai-note">${esc(t('askAiRunning'))}</span></div>`;
  if (aiJob.state === 'failed')
    return `<div class="ask-ai"><span class="ask-ai-note err">${esc(t('askAiFailed', { reason: aiJob.error || '' }))}</span><button type="button" class="ask-ai-btn" data-action="ask-ai">${esc(t('askAiRetry'))}</button></div>`;
  return '';
}

function aiFetch(path, init = {}) {
  return fetch(path, { ...init, headers: { 'Content-Type': 'application/json', 'X-Prisme-Token': PAGE_TOKEN, ...(init.headers || {}) } })
    .then(r => r.json().catch(() => ({})).then(body => ({ ok: r.ok, body })));
}

function refreshAskAi() {
  const block = askPanel.querySelector('.ask-ai');
  const html = askAiBlock();
  if (block) block.outerHTML = html;
  else if (!askPanel.hidden && html) askPanel.insertAdjacentHTML('afterbegin', html);
}

async function followAiJob() {
  while (aiJob && aiJob.state === 'running') {
    await new Promise(r => setTimeout(r, 3000));
    const { ok, body } = await aiFetch('/api/v1/ask/ai/' + aiJob.id);
    if (!ok) { aiJob = { state: 'failed', error: body.error || '' }; break; }
    aiJob = body;
  }
  refreshAskAi();
  if (aiJob && aiJob.state === 'done') {
    const id = aiJob.guideId;
    await loadGuidesIntoViewer();
    clearSearch();
    startGuide(id, 0);
  }
}

async function askClaude(question = askInput.value.trim()) {
  if (!AI || question.length < 3 || (aiJob && aiJob.state === 'running')) return;
  aiJob = { state: 'running' };
  refreshAskAi();
  const { ok, body } = await aiFetch('/api/v1/ask/ai', { method: 'POST', body: JSON.stringify({ question }) });
  // 409: a question is already being answered (another tab): follow that one.
  aiJob = ok ? body : body.job ? body.job : { state: 'failed', error: body.error || '' };
  refreshAskAi();
  followAiJob();
}

// A reloaded page picks up the question being answered.
if (AI) aiFetch('/api/v1/ask/ai/current').then(({ ok, body }) => {
  if (ok && body && body.state === 'running') { aiJob = body; followAiJob(); }
});

function renderAskPanel(results) {
  askPanel.hidden = false;
  const close = `<button type="button" class="ask-close" data-action="close" aria-label="${esc(t('askClose'))}">×</button>`;
  // While Claude works, the word search is only a preview.
  const meanwhile = aiJob && aiJob.state === 'running' ? `<div class="ask-others-label">${esc(t('askMeanwhile'))}</div>` : '';
  if (!results.length) {
    askPanel.innerHTML = askAiBlock() + `<div class="ask-answer-head"><span class="ask-empty">${esc(t(meanwhile ? 'askNoWords' : 'askNoResults'))}</span>${close}</div>`;
    return;
  }
  const [top, ...rest] = results;
  let html = askAiBlock() + meanwhile + `<div class="ask-answer">
    <div class="ask-answer-head">
      <span class="ask-answer-title" data-go="${esc(top.cls)}">${esc(top.title)}</span>
      <span class="ask-answer-field">${esc(fieldLabel(top.field))}</span>
      ${close}
    </div>
    <div class="ask-answer-snippet">${esc(top.snippet)}</div>
  </div>`;
  if (rest.length) {
    html += `<div class="ask-others"><div class="ask-others-label">${esc(t('askOtherMatches'))}</div>`;
    html += rest.map(r => `<div class="ask-other" data-go="${esc(r.cls)}">${esc(r.title)}</div>`).join('');
    html += `</div>`;
  }
  askPanel.innerHTML = html;
}

askPanel.addEventListener('click', e => {
  const close = e.target.closest('[data-action="close"]');
  if (close) { clearSearch(); return; }
  if (e.target.closest('[data-action="ask-ai"]')) { askClaude(); return; }
  const go = e.target.closest('[data-go]');
  if (go) window.__openSb(go.dataset.go);
});

// Enter: Claude answers on the map (when it can), the word search shows something meanwhile.
async function runSearch() {
  const q = askInput.value.trim();
  if (!q) { clearSearch(); return; }
  if (AI && q.length >= 3 && !(aiJob && aiJob.state === 'running')) askClaude(q);
  const data = await api('/api/ask?q=' + encodeURIComponent(q));
  const results = (data && data.results) || [];
  searchActive = true;
  renderAskPanel(results);
  if (results.length) {
    paintSearchResults(results);
    window.__openSb(results[0].cls);
  } else {
    canvasWrap.classList.add('guiding');
    clearPaintMarks();
  }
}

askSubmit.addEventListener('click', runSearch);
askInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') runSearch();
  else if (e.key === 'Escape') { askInput.value = ''; askInput.blur(); clearSearch(); }
});

async function loadGuidesIntoViewer() {
  const data = await api('/api/guides');
  guides = Array.isArray(data) ? data : [];
  if (activeGuide) {
    const again = guides.find(g => g.id === activeGuide.id && g.valid);
    if (!again) return exitGuide();
    activeGuide = again;
    guideStep = Math.min(guideStep, again.guide.steps.length - 1);
    // A reload (scan, AI edit) must not move the view or the selection.
    renderGuideBar();
    paintGuideStep();
    renderGuideList();
    return;
  }
  renderGuideList();
  if (startLinkedGuide(60)) return;
  suggestStartGuide();
}

// #guide=<id>&step=<n> opens a guide at a step; returns whether it did.
function startLinkedGuide(delay = 0) {
  const link = new URLSearchParams(location.hash.slice(1));
  const linked = link.get('guide');
  if (!linked || !guides.some(g => g.id === linked && g.valid)) return false;
  const step = Math.max(0, (parseInt(link.get('step') || '1', 10) || 1) - 1);
  setTimeout(() => startGuide(linked, step), delay);
  return true;
}
// A link pasted into an open viewer changes only the hash.
window.addEventListener('hashchange', () => startLinkedGuide());

// ── nested element support ────────────────────────────────
var childrenByPerspective = {};
var originalPerspectives = []; // top-level only, before short names pollute classes

async function loadNodeData(perspective, childName) {
  var key = perspective + '/' + childName;
  if (classesData[key]) return classesData[key];
  var data = await api('/api/class/' + perspective + '/node/' + childName);
  if (data && !data.error) {
    classesData[key] = data;
    // Short name in classesData ONLY for renderGroup ref lookup
    // Do NOT add to classes array — only perspectives belong there
    classesData[childName] = data;
    // Also load this element's children (depth 2+)
    if (data.children && data.children.length > 0) {
      var subLoads = [];
      for (var sub of data.children) {
        subLoads.push(loadSubNodeData(perspective, childName + '/' + sub, sub));
      }
      await Promise.all(subLoads);
    }
  }
  return data;
}

async function loadSubNodeData(perspective, subPath, shortName) {
  if (classesData[perspective + '/' + subPath]) return;
  var data = await api('/api/class/' + perspective + '/node/' + subPath);
  if (data && !data.error) {
    classesData[perspective + '/' + subPath] = data;
    classesData[shortName] = data;
    // Recurse for deeper children
    if (data.children && data.children.length > 0) {
      var deepLoads = [];
      for (var sub of data.children) {
        deepLoads.push(loadSubNodeData(perspective, subPath + '/' + sub, sub));
      }
      await Promise.all(deepLoads);
    }
  }
}

}

function threatsSection(m) {
  if (!m || m.error) return `<div class="sec-sub">${esc(t('thNone', { cmd: '\u0001' })).replace('\u0001', '<code>/prisme-security</code>')}</div>`;
  const assets = m.assets?.length ? `<div><div class="sec-group-title">${esc(t('thAssets'))}</div><ul class="th-list">${m.assets.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>` : '';
  const bounds = m.boundaries?.length ? `<div><div class="sec-group-title">${esc(t('thBoundaries'))}</div><ul class="th-list">${m.boundaries.map(b => `<li><b>${esc(displayTitle(b.from))} → ${esc(displayTitle(b.to))}</b> : ${esc(b.why)}</li>`).join('')}</ul></div>` : '';
  // Threats grouped by element, in the model's order (most worrying first).
  const byEl = new Map();
  for (const th of m.threats || []) byEl.set(th.element, [...(byEl.get(th.element) || []), th]);
  const threats = [...byEl].map(([el, list]) => `<div><div class="sec-group-title">${esc(displayTitle(el))} · ${list.length}</div>${list.map(threatItem).join('')}</div>`).join('');
  const themes = new Map();
  for (const q of m.questions || []) themes.set(q.theme, [...(themes.get(q.theme) || []), q]);
  const questions = [...themes].map(([theme, list]) => `<div class="q-theme"><div class="sec-group-title">${esc(theme)}</div>${list.map(q => `<div class="q-item"><b>${esc(q.question)}</b><span class="sec-chip ${q.status === 'answered' ? 'th-st-mitigated' : 'th-st-open'}" style="align-self:flex-start">${esc(t(q.status === 'answered' ? 'qAnswered' : 'qOpen'))}</span>${q.answer ? `<span>${esc(q.answer)}</span>` : ''}</div>`).join('')}</div>`).join('');
  return `<div class="sec-title" style="font-size:18px">${esc(t('thTitle'))}</div>
    <div class="sec-sub">${esc(t('thIntro'))}</div>
    ${m.summary ? `<div class="sec-sub ev-md">${safeMarkdown(m.summary)}</div>` : ''}
    ${assets}${bounds}${threats}
    ${questions ? `<div class="sec-title" style="font-size:18px">${esc(t('qTitle'))}</div><div class="sec-sub">${esc(t('qIntro'))}</div>${questions}` : ''}`;
}

async function openSecurity(report) {
  const r = report || await api('/api/v1/security');
  if (!r || r.error) return;
  threatModel = await api('/api/v1/threats');
  const date = r.date ? new Date(r.date).toLocaleString(document.documentElement.lang) : '';
  const chips = SEVS.filter(s => r.counts?.[s]).map(s => `<span class="sec-chip sev-${s}">${r.counts[s]} · ${esc(t('sev_' + s))}</span>`).join('');
  const how = esc(t('secHow', { cmd: '\u0001', skill: '\u0002' })).replace('\u0001', '<code>prisme security</code>').replace('\u0002', '<code>/prisme-security</code>');
  const groups = SEVS.map(s => {
    const items = (r.findings || []).filter(f => f.severity === s);
    return items.length ? `<div><div class="sec-group-title">${esc(t('sev_' + s))} · ${items.length}</div>${items.map(securityItem).join('')}</div>` : '';
  }).join('');
  const tools = (r.tools || []).map(x => `${esc(x.name)} : ${esc(t('tool_' + x.status))}${x.status === 'ran' ? ` (${x.findings})` : ''}`).join(' · ');
  const ignored = (r.ignored || []).length
    ? `<div><div class="sec-group-title">${esc(t('secIgnored', { count: r.ignored.length }))}</div>${r.ignored.map(securityItem).join('')}</div>` : '';
  securityEl.innerHTML = `<div class="sec-box">
    <div class="sec-nav"><button type="button" class="hbtn" data-act="home">${esc(t('secBack'))}</button><button type="button" class="hbtn" data-act="map">${esc(t('secMap'))}</button><button type="button" class="hbtn" data-act="recompute">${esc(t('secRecompute'))}</button></div>
    <div class="sec-head">
      <div class="sec-grade g-${esc(r.grade)}">${esc(r.grade)}</div>
      <div class="sec-summary">
        <div class="sec-title">${esc(t('tileSecurity'))}</div>
        <div class="sec-sub">${esc(t('secOutOf', { score: r.score, date }))} · ${esc(t('secFiles', { count: r.files }))}</div>
        <div class="sec-chips">${chips}</div>
      </div>
    </div>
    <div class="sec-sub">${how}</div>
    ${groups || `<div class="sec-empty">${esc(t('secNothing'))}</div>`}
    ${ignored}
    ${threatsSection(threatModel)}
    <div class="sec-tools"><div class="sec-group-title">${esc(t('secTools'))}</div>${tools}</div>
  </div>`;
  closeHome();
  securityEl.hidden = false;
  securityEl.scrollTop = 0;
  securityEl.querySelector('[data-act="home"]')?.focus();
}

securityEl.addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'home') { securityEl.hidden = true; openHome(); return; }
  if (act === 'map') { securityEl.hidden = true; return; }
  if (act === 'recompute') { computeSecurity(); return; }
  const go = e.target.closest('[data-go]');
  if (go) { securityEl.hidden = true; window.__openSb(go.dataset.go); }
});
securityEl.addEventListener('keydown', e => { if (e.key === 'Escape') securityEl.hidden = true; });
homeEl.addEventListener('keydown', e => { if (e.key === 'Escape') closeHome(); });
document.getElementById('home-btn').addEventListener('click', openHome);
document.getElementById('mobile-home-btn').addEventListener('click', openHome);

// First visit: no level chosen yet, and no guide link to follow.
function maybeShowHome() {
  if (homeChecked) return;
  homeChecked = true;
  if (safeStorageGet(PROFILE_KEY) || new URLSearchParams(location.hash.slice(1)).get('guide')) return;
  openHome();
}

// ── init ──────────────────────────────────────────────────
async function init() {
  applyTheme();
  const [config, list] = await Promise.all([api('/api/config'), api('/api/classes')]);
  setLanguage(config.language);
  classes = Array.isArray(list) ? list : [];
  if (!classes.length) {
    const hint = esc(I18N[lang].emptyHint).replace('{cmd}', '<code>/prisme-scan</code>');
    canvasEl.innerHTML=`<div class="empty-state" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%)"><p>${esc(t('emptyTitle'))}<br>${hint}</p></div>`;
    return;
  }
  const [da,ra,na] = await Promise.all([
    Promise.all(classes.map(c=>api(`/api/class/${c}`))),
    Promise.all(classes.map(c=>api(`/api/class/${c}/refs`))),
    Promise.all(classes.map(c=>api(`/api/class/${c}/nodes`))),
  ]);
  originalPerspectives = [...classes];
  classes.forEach((c,i)=>{
    classesData[c]=da[i];
    refsData[c]=ra[i];
    childrenByPerspective[c]=(na[i]&&na[i].children)||[];
  });

  // Pre-load nested element data for all children
  var nodeLoads = [];
  for (var persp of Object.keys(childrenByPerspective)) {
    for (var child of childrenByPerspective[persp]) {
      nodeLoads.push(loadNodeData(persp, child));
    }
  }
  await Promise.all(nodeLoads);

  // Set project name and build nav tree
  var projName = window.__projectName || 'prisme';
  navTitle.textContent = projName;
  var mobileTitle = document.getElementById('mobile-title');
  if (mobileTitle) mobileTitle.textContent = projName;
  buildNavTree();

  const result = buildCanvas(originalPerspectives, classesData, refsData);
  if (result) {
    canvasEl.innerHTML = result.html;
    svgW = result.W; svgH = result.H;
  }
  postRender();
  paintGuideStep();
  if (!activeGuide) requestAnimationFrame(centerView);
  await loadGuidesIntoViewer();
  threatModel = await api('/api/v1/threats');
  maybeShowHome();

  // Cloud mode: notify parent frame of available classes
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'classes-loaded', classes: classes, refs: refsData }, '*');
  }

  // Cloud mode: listen for parent frame messages
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'select-class') {
      var className = e.data.className;
      if (typeof window.__openSb === 'function') {
        window.__openSb(className);
      }
    }
  });
}

window.toggleMobileNav = function() {
  const nav = document.getElementById('nav-sidebar');
  const overlay = document.getElementById('mobile-overlay');
  const isOpen = nav.classList.contains('mobile-open');
  nav.classList.toggle('mobile-open', !isOpen);
  overlay.classList.toggle('show', !isOpen);
};

function setupLiveReload() {
  if (!window.EventSource) return;

  try {
    const sse = new EventSource('/events');
    sse.addEventListener('change', async () => {
      const sel = selectedCls;
      await init();
      if (sel && classes.includes(sel)) window.__openSb(sel);
    });
  } catch {}
}

setupLiveReload();
init();
</script>
