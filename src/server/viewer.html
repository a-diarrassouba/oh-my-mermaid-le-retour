<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>oh-my-mermaid</title>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #000000;
  --border: #333333;
  --border-hi: #333;
  --text: #ffffff;
  --text-mid: #888;
  --text-dim: #555;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Fira Code', monospace;
  --sidebar-w: 400px;
  --accent: #818cf8;
  --surface: #0a0a0a;
  --surface-2: #141414;
}
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* Nav sidebar */
#nav-sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 200px;
  background: #000; border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 200;
}
#nav-title {
  padding: 14px 16px;
  font-size: 13px; font-weight: 600; color: #fff;
  font-family: var(--mono);
}
#nav-list {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: #1a1a1a transparent;
}
.nav-item {
  display: flex; align-items: center; width: 100%; height: 24px;
  padding: 0 16px 0 0;
  font-size: 11.5px; font-family: 'Geist Mono', 'JetBrains Mono', 'Fira Code', var(--mono);
  color: #666; cursor: pointer;
  border: none; background: none; text-align: left;
  transition: color .12s, background .12s;
  white-space: nowrap; overflow: hidden;
}
.nav-item.nav-root { color: #bbb; font-size: 12px; height: 28px; padding-left: 16px; margin-top: 2px; }
.nav-pre { display: flex; align-self: stretch; align-items: stretch; flex-shrink: 0; padding-left: 16px; }
.nav-slot { width: 12px; position: relative; flex-shrink: 0; }
.nav-slot-line::before {
  content: ''; position: absolute;
  left: 6px; top: 0; bottom: 0; width: 1px; background: #222;
}
.nav-conn { width: 18px; position: relative; flex-shrink: 0; }
.nav-conn::before {
  content: ''; position: absolute;
  left: 6px; top: 0; width: 1px; background: #2e2e2e;
}
.nav-conn:not(.nav-conn-last)::before { bottom: 0; }
.nav-conn-last::before { bottom: 50%; }
.nav-conn::after {
  content: ''; position: absolute;
  left: 6px; right: 0; top: 50%; height: 1px;
  transform: translateY(-50%); background: #2e2e2e;
}
.nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { color: #fff; background: #0d0d0d; }
.nav-item:hover .nav-slot-line::before,
.nav-item:hover .nav-conn::before,
.nav-item:hover .nav-conn::after { background: #555; }
.nav-item.active { color: #fff; background: #141414; }
.nav-item.active .nav-slot-line::before,
.nav-item.active .nav-conn::before,
.nav-item.active .nav-conn::after { background: #555; }

/* Floating controls */
.float-controls {
  position: absolute; top: 12px; right: 12px;
  display: flex; align-items: center; gap: 3px;
  z-index: 100;
  background: rgba(0,0,0,0.7);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 6px;
  backdrop-filter: blur(8px);
}
.hbtn { background: none; border: 1px solid var(--border-hi); color: var(--text-mid); height: 26px; min-width: 26px; padding: 0 8px; border-radius: 5px; cursor: pointer; font-size: 13px; font-family: var(--font); transition: border-color .12s, color .12s; }
.hbtn:hover { border-color: #3a3a3a; color: var(--text); }
#zoom-label { font-size: 11px; color: var(--text-dim); width: 38px; text-align: center; font-family: var(--mono); }

#canvas-wrap {
  flex: 1; position: relative; overflow: hidden; cursor: grab; margin-left: 200px;
  background-color: var(--bg);
  background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
  background-size: 28px 28px;
  user-select: none;
}
#canvas-wrap.panning { cursor: grabbing; }
#canvas { position: absolute; transform-origin: 0 0; }
#canvas svg { display: block; overflow: visible; }

/* SVG interactive elements */
.grp-node { cursor: pointer; }
.grp-node .grp-border { transition: stroke .12s, filter .12s; }
.grp-node:hover > .grp-border { stroke: #ffffff !important; stroke-width: 2.5px; filter: drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
.grp-node.selected > .grp-border { stroke: #818cf8 !important; stroke-width: 2.5px; stroke-dasharray: none !important; filter: drop-shadow(0 0 8px rgba(129,140,248,0.6)); }
.reg-node { cursor: pointer; }
.reg-node .nshape { transition: stroke .12s, filter .12s; }
.reg-node:hover .nshape { stroke: #ffffff !important; stroke-width: 2.5px; filter: drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
/* Edge highlight on node hover */
.edge-path.edge-hl { stroke: #ffffff !important; stroke-width: 2.5px; opacity: 1; transition: all .15s; }
.reg-node.selected .nshape { stroke: #818cf8 !important; stroke-width: 2.5px; filter: drop-shadow(0 0 8px rgba(129,140,248,0.6)); }
/* Overview mode: per-element fade — borders + edges stay visible */
.grp-inner { transition: opacity .25s; }
/* Collapsed groups: dim inner content, show center label */
.grp-node.grp-collapsed > .grp-inner { opacity: 0.15; pointer-events: none; transition: opacity .25s; }
.grp-node.grp-collapsed > .grp-label-top { opacity: 0; transition: opacity .25s; }
.grp-node.grp-collapsed > .grp-label-bg { opacity: 0; transition: opacity .25s; }
/* Focus-exempt override for collapsed groups */
.grp-node.grp-collapsed.focus-exempt > .grp-inner { opacity: 1 !important; pointer-events: auto !important; }
.grp-node.grp-collapsed.focus-exempt > .grp-label-top { opacity: 1 !important; }
.grp-node.grp-collapsed.focus-exempt > .grp-label-bg { opacity: 1 !important; }
.grp-node.grp-collapsed.focus-exempt > .grp-label-center { display: none !important; }
#canvas-wrap.zoom-overview .grp-inner { pointer-events: none; }
#canvas-wrap.zoom-overview .grp-inner > .reg-node { opacity: 0.2; transition: opacity .25s; }
#canvas-wrap.zoom-overview .grp-inner .edge-path { opacity: 0.4; transition: opacity .25s; }
#canvas-wrap.zoom-overview .grp-inner .edge-label { opacity: 0; }
#canvas-wrap.zoom-overview .grp-inner > .grp-node > .grp-inner { opacity: 0.06; }
#canvas-wrap.zoom-overview .grp-inner > .grp-node > .grp-border { opacity: 0.60; }
#canvas-wrap.zoom-overview .grp-inner > .grp-node > .grp-label-top { opacity: 0; }
/* Top-level group labels */
.grp-label-center { display: none; }
#canvas-wrap.zoom-overview .grp-label-top { display: none; }
#canvas-wrap.zoom-overview .grp-label-center { display: block; }
/* Hide sub-group direct center labels in zoom-overview (labelOverlay handles these) */
#canvas-wrap.zoom-overview .grp-inner > .grp-node > .grp-label-center { display: none; }
/* Sub-group overlay labels (outside grp-inner — unaffected by opacity) */
.grp-sub-labels { display: none; pointer-events: none; }
.grp-sub-labels text { opacity: 0.45; }
/* Depth-aware labels: expanded groups hide center, show top-left */
.grp-node.grp-expanded > .grp-label-center { display: none; }
/* Center label only visible when collapsed (not merely non-expanded) */
.grp-node.grp-collapsed:not(.grp-expanded) > .grp-label-center { display: block; opacity: 0.85; }
/* Top-level expanded: hide center */
[data-cls].grp-expanded > .grp-label-center { display: none; }
#canvas-wrap.zoom-overview .grp-sub-labels { display: block; }
/* Focused group: restore full visibility */
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner { pointer-events: auto !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner > .reg-node { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .edge-path { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .edge-label { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .grp-node .grp-inner { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .grp-node .grp-border { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .grp-node .grp-label-top { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt .grp-label-top { display: block !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt .grp-label-center { display: none !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-sub-labels { display: none !important; }

/* Sidebar */
#sidebar {
  position: fixed; top: 0; right: 0; bottom: 0; width: var(--sidebar-w);
  background: #000; border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform .22s cubic-bezier(.4,0,.2,1);
  z-index: 300; display: flex; flex-direction: column;
}
#sidebar.open { transform: translateX(0); }
#sb-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#sb-title { flex: 1; font-size: 14px; font-weight: 600; color: #fff; font-family: var(--mono); }
#sb-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 22px; line-height: 1; padding: 0; }
#sb-close:hover { color: #888; }
#sb-body { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #1a1a1a transparent; }

.sb-diagram { padding: 16px; border-bottom: 1px solid var(--border); background: #030303; }
.sb-diagram svg { display: block; width: 100%; height: auto; overflow: visible; }
.sb-fields { padding: 16px 20px; }
.sb-sec { margin-bottom: 20px; }
.sb-sec-title { font-size: 9px; text-transform: uppercase; letter-spacing: .14em; color: #888; padding-bottom: 7px; border-bottom: 1px solid #1e1e1e; margin-bottom: 9px; font-weight: 600; }
.sb-sec-body { font-size: 12px; line-height: 1.72; color: #bbb; }
.sb-sec-body p { margin-bottom: 6px; }
.sb-sec-body ul, .sb-sec-body ol { padding-left: 16px; }
.sb-sec-body li { margin-bottom: 3px; }
.sb-sec-body code { background: #111; padding: 1px 5px; border-radius: 2px; font-size: 11px; color: #ccc; font-family: var(--mono); }
.sb-sec-body strong { color: #eee; }
.sb-concern .sb-sec-body { border-left: 2px solid #444; padding-left: 10px; }
.sb-meta-text { font-size: 10px; color: #777; line-height: 1.9; font-family: var(--mono); }
.sb-refs { display: flex; flex-direction: column; gap: 4px; }
.sb-ref { font-size: 11px; color: #999; padding: 5px 10px; background: #090909; border: 1px solid #1e1e1e; border-radius: 4px; cursor: pointer; display: block; font-family: var(--mono); transition: border-color .12s, color .12s; }
.sb-ref:hover { border-color: #333; color: #bbb; }
.empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
.empty-state p { font-size: 12px; color: #444; line-height: 1.9; }
/* Light mode */
body.light { --bg: #f0f0f0; --border: #ddd; --border-hi: #bbb; --text: #1a1a1a; --text-mid: #555; --text-dim: #aaa; --accent: #4f46e5; --surface: #ffffff; --surface-2: #ebebeb; }
body.light header { background: #fff; }
body.light #canvas-wrap { background-color: #f0f0f0; background-image: radial-gradient(circle, #ccc 1px, transparent 1px); }
body.light #sidebar { background: #fafafa; }
body.light #sb-body { scrollbar-color: #ddd transparent; }
body.light .hbtn { border-color: #ccc; color: #666; }
body.light .hbtn:hover { border-color: #aaa; color: #222; }
body.light .sb-diagram { background: #f5f5f5; }
body.light .sb-sec-title { color: #aaa; border-color: #ddd; }
body.light .sb-sec-body { color: #555; }
body.light .sb-sec-body code { background: #e5e5e5; color: #333; }
body.light .sb-sec-body strong { color: #222; }
body.light .sb-concern .sb-sec-body { border-color: #ccc; }
body.light .sb-meta-text { color: #999; }
body.light .sb-ref { background: #eee; border-color: #ddd; color: #555; }
body.light .sb-ref:hover { border-color: #aaa; color: #111; }
body.light .empty-state p { color: #bbb; }
body.light #nav-sidebar { background: #fff; }
body.light .nav-item { color: #999; }
body.light .nav-item.nav-root { color: #333; }
body.light .nav-slot-line::before { background: #ddd; }
body.light .nav-conn::before, body.light .nav-conn::after { background: #ddd; }
body.light .nav-item:hover { color: #000; background: #f5f5f5; }
body.light .nav-item:hover .nav-slot-line::before,
body.light .nav-item:hover .nav-conn::before,
body.light .nav-item:hover .nav-conn::after { background: #bbb; }
body.light .nav-item.active { color: #000; background: #ebebeb; }
body.light .nav-item.active .nav-slot-line::before,
body.light .nav-item.active .nav-conn::before,
body.light .nav-item.active .nav-conn::after { background: #bbb; }
body.light .float-controls { background: rgba(255,255,255,0.8); }
body.light .grp-node:hover > .grp-border { stroke: #000 !important; filter: drop-shadow(0 0 6px rgba(0,0,0,0.3)); }
body.light .grp-node.selected > .grp-border { stroke: #4f46e5 !important; filter: drop-shadow(0 0 8px rgba(79,70,229,0.4)); }
body.light .reg-node:hover .nshape { stroke: #000 !important; filter: drop-shadow(0 0 6px rgba(0,0,0,0.3)); }
body.light .reg-node.selected .nshape { stroke: #4f46e5 !important; filter: drop-shadow(0 0 8px rgba(79,70,229,0.4)); }
body.light .reg-node:hover .nshape { stroke: #000 !important; }

#mobile-nav-btn { display: none; }
#mobile-overlay { display: none; }

/* Mobile responsive */
@media (max-width: 768px) {
  #nav-sidebar {
    transform: translateX(-100%);
    transition: transform .22s cubic-bezier(.4,0,.2,1);
    z-index: 500;
  }
  #nav-sidebar.mobile-open { transform: translateX(0); }
  #canvas-wrap { left: 0 !important; margin-left: 0 !important; }
  #mobile-nav-btn {
    display: flex; align-items: center; gap: 8px;
    position: fixed; top: 10px; left: 10px; z-index: 400;
    background: rgba(0,0,0,0.75); border: 1px solid #333;
    border-radius: 6px; padding: 6px 12px;
    color: #fff; font-size: 13px; font-family: var(--mono);
    cursor: pointer; backdrop-filter: blur(8px);
  }
  #mobile-nav-btn span { font-size: 16px; }
  #mobile-overlay {
    display: none; position: fixed; inset: 0; z-index: 450;
    background: rgba(0,0,0,0.5);
  }
  #mobile-overlay.show { display: block; }
  #sidebar {
    top: auto; right: 0; bottom: 0; left: 0;
    width: 100%; height: 50vh;
    max-height: 70vh;
    border-left: none; border-top: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
    transform: translateY(100%);
  }
  #sidebar.open { transform: translateY(0); }
  #sb-head {
    position: relative;
    padding: 12px 20px 10px;
  }
  #sb-head::before {
    content: '';
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 4px;
    background: #444; border-radius: 2px;
  }
  .float-controls { display: none; }
}
/* ── Guides ──────────────────────────────────────────────────
   A guide walks through elements of the diagram. While it runs, #canvas-wrap
   has .guiding: visited elements stay lit (.guide-lit), the rest fades, the
   edges already walked stay tinted (.guide-trail) and the current one flows
   (.guide-edge). These rules come after the zoom-overview ones on purpose. */
#nav-guides { border-top: 1px solid var(--border); max-height: 46%; overflow-y: auto; padding: 8px 0 10px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.nav-section { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); padding: 4px 16px 2px; }
.guide-start { margin: 0 12px; padding: 10px 12px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); display: flex; flex-direction: column; gap: 4px; }
.guide-start .gs-eyebrow { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.guide-start .gs-title { font-size: 13px; font-weight: 600; color: var(--text); }
.guide-start .gs-meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-mid); }
.guide-start button { margin-top: 4px; align-self: flex-start; border: 0; border-radius: 6px; padding: 5px 10px; background: var(--accent); color: var(--bg); font-family: var(--font); font-size: 12px; font-weight: 600; cursor: pointer; }
.guide-start-done { margin: 0 12px; border: 0; background: none; padding: 4px; text-align: left; font-family: var(--font); font-size: 12px; color: var(--text-mid); cursor: pointer; border-radius: 6px; }
.guide-start-done:hover { color: var(--text); background: var(--surface-2); }
.guide-item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 16px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--text); font-family: var(--font); font-size: 12px; line-height: 1.35; }
.guide-item > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.guide-item small { flex-shrink: 0; font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); }
.guide-item:hover { background: var(--surface-2); }
.guide-item.active { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.guide-item .guide-check { color: var(--accent); flex-shrink: 0; width: 10px; font-size: 11px; font-style: normal; }
.guide-item.invalid { cursor: help; }
.guide-item.invalid > span { color: var(--text-dim); }
.guide-item.invalid small { color: #f38ba8; }

#guide-bar {
  position: fixed; left: 212px; right: 12px; bottom: 12px; z-index: 250;
  background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--accent);
  border-radius: 10px; padding: 12px 14px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.28);
}
#guide-bar[hidden] { display: none; }
#sidebar.open ~ #guide-bar { right: calc(var(--sidebar-w) + 12px); }
.gb-kind { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); padding: 3px 8px; border-radius: 6px; }
.gb-main { min-width: 0; }
.gb-title { font-weight: 600; font-size: 13px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gb-sub { font-size: 12px; color: var(--text-mid); margin-top: 2px; }
.gb-steps { display: flex; gap: 5px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.gb-steps button { width: 22px; height: 6px; border-radius: 3px; border: 0; padding: 0; background: var(--border-hi); cursor: pointer; }
.gb-steps button.done { background: var(--accent); opacity: .45; }
.gb-steps button.cur { background: var(--accent); }
.gb-steps .gb-gap { width: 8px; }
.gb-steps span { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-left: 6px; font-variant-numeric: tabular-nums; }
.gb-actions { display: flex; gap: 6px; }
.gb-btn { border: 1px solid var(--border-hi); background: var(--surface); color: var(--text); border-radius: 7px; padding: 6px 12px; font-size: 12.5px; font-family: var(--font); cursor: pointer; }
.gb-btn:hover { border-color: var(--text-dim); }
.gb-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.gb-btn:disabled { opacity: .4; cursor: default; }
.gb-close { border: 0; background: none; color: var(--text-dim); font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px; }

.sb-step { margin: 14px 20px 0; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--accent); font-size: 12.5px; color: var(--text); line-height: 1.6; }
.sb-step[hidden] { display: none; }
.sb-step b { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: 2px; }
.sb-step .sb-say { margin: 4px 0 0; }
.sb-step .sb-say code { background: var(--bg); padding: 1px 5px; border-radius: 3px; font-family: var(--mono); font-size: .88em; font-weight: 400; }
/* Guide mode: on the step's element, the panel tells the step only. The
   full sheet stays one click away (.show-full). */
#sidebar.guide-mode:not(.show-full) .sb-fields,
#sidebar.guide-mode:not(.show-full) .sb-diagram { display: none; }
#sidebar.guide-mode .sb-step { margin: 18px 20px; padding: 16px 18px; font-size: 14px; }
#sidebar.guide-mode .sb-step .sb-say { font-size: 16px; line-height: 1.5; font-weight: 500; }
.sb-step .sb-details { margin-top: 12px; font-size: 13.5px; line-height: 1.7; color: var(--text-mid); }
.sb-step .sb-details p { margin: 0 0 8px; }
.sb-step .sb-details ul, .sb-step .sb-details ol { padding-left: 18px; margin: 0 0 8px; }
.sb-step .sb-details strong { color: var(--text); }

}
</style>

<script type="module">
// ── interface language ────────────────────────────────────
const I18N = {
  en: {
    zoomOut: 'Zoom out', zoomIn: 'Zoom in', fit: 'fit', fitTitle: 'Fit to screen',
    theme: 'Switch theme', close: 'Close',
    meta: 'Meta', description: 'Description', constraint: 'Constraints', concern: 'Concerns',
    context: 'Context', todo: 'Todo', note: 'Notes', references: 'References',
    updatesOne: '{n} update', updatesOther: '{n} updates',
    emptyTitle: 'No perspectives found.', emptyHint: 'Run {cmd} in Claude Code.',
    guides: 'Guides', guideInvalid: 'needs fixing: run omm validate', stepN: 'Step {n}',
    stepsOne: '{n} step', stepsOther: '{n} steps', partsOne: '{n} part', partsOther: '{n} parts',
    kindPath: 'guide', kindTrace: 'scenario', back: 'Back', next: 'Next', finish: 'Finish', exitGuide: 'Exit',
    stepOf: 'Step {i} of {n}', partOf: 'Part {i}/{n} — {name}',
    showFull: 'See the full sheet', hideFull: 'Back to the step',
    newHere: 'New to this project?', startBtn: '▶ Start', welcome: 'Start here', replayWelcome: '✓ Replay the welcome guide',
  },
  fr: {
    zoomOut: 'Zoom arrière', zoomIn: 'Zoom avant', fit: 'ajuster', fitTitle: "Ajuster à l'écran",
    theme: 'Changer de thème', close: 'Fermer',
    meta: 'Infos', description: 'Description', constraint: 'Contraintes', concern: "Points d'attention",
    context: 'Contexte', todo: 'À faire', note: 'Notes', references: 'Références',
    updatesOne: '{n} mise à jour', updatesOther: '{n} mises à jour',
    emptyTitle: 'Aucune perspective trouvée.', emptyHint: 'Lancez {cmd} dans Claude Code.',
    guides: 'Parcours', guideInvalid: 'à corriger : lancez omm validate', stepN: 'Étape {n}',
    stepsOne: '{n} étape', stepsOther: '{n} étapes', partsOne: '{n} partie', partsOther: '{n} parties',
    kindPath: 'parcours', kindTrace: 'scénario', back: 'Précédent', next: 'Suivant', finish: 'Terminer', exitGuide: 'Quitter',
    stepOf: 'Étape {i} sur {n}', partOf: 'Partie {i}/{n} — {name}',
    showFull: 'Voir la fiche complète', hideFull: "Revenir à l'étape",
    newHere: 'Nouveau sur ce projet ?', startBtn: '▶ Commencer', welcome: 'Pour commencer', replayWelcome: "✓ Revoir le parcours d'accueil",
  },
};
let lang = 'en';
// `fr-CA` uses the `fr` texts; a language without texts falls back to English.
function setLanguage(code) {
  const primary = String(code || '').toLowerCase().split('-')[0];
  lang = I18N[primary] ? primary : 'en';
  document.documentElement.lang = typeof code === 'string' && code ? code : lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);
    el.setAttribute('aria-label', el.title);
  });
}
function t(key, vars = {}) {
  const text = I18N[lang][key] ?? I18N.en[key] ?? key;
  return text.replace(/\{(\w+)\}/g, (_, k) => String(vars[k] ?? ''));
}

// ── theme ─────────────────────────────────────────────────
function safeStorageGet(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}
function safeStorageSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {}
}
let isDark = safeStorageGet('omm-theme') !== 'light';
function applyTheme() {
  document.body.classList.toggle('light', !isDark);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = isDark ? '○' : '●';
}
window.toggleTheme = function() {
  isDark = !isDark;
  safeStorageSet('omm-theme', isDark ? 'dark' : 'light');
  applyTheme();
  rebuildCanvas();
};
function theme() {
  return isDark ? {
    groupFill:'#0a0a0a', groupStroke:'#666666',
    subFill:'#111111', subStroke:'#666666', subLabelFill:'#ffffff',
    edgeColor0:'#909090', edgeColor1:'#787878',
    edgeLabelBg:'#000000', edgeLabelText:'#aaaaaa',
    grpLabelFill:'#ffffff', grpLabelCenterFill:'#dddddd',
  } : {
    groupFill:'#f8f8f8', groupStroke:'#bbb',
    subFill:'#efefef', subStroke:'#bbb', subLabelFill:'#888',
    edgeColor0:'#94a3b8', edgeColor1:'#bbb',
    edgeLabelBg:'#e8e8e8', edgeLabelText:'#475569',
    grpLabelFill:'#475569', grpLabelCenterFill:'#222',
  };
}

// ── helpers ──────────────────────────────────────────────
const _tm = document.createElement('canvas').getContext('2d');
function tw(t, f) { _tm.font = f || '11px Inter,system-ui'; return Math.ceil(_tm.measureText(t).width); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function r1(n) { return +n.toFixed(1); }
function fmtLabel(s) { return s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '); }
// The element's title from meta.yaml; older metas hold the id itself, which gets formatted instead.
function customTitle(key) {
  const id = String(key).split('/').pop();
  const title = (classesData[key] || classesData[id])?.meta?.title;
  return typeof title === 'string' && title.trim() && title !== id ? title : null;
}
function displayTitle(key) { return customTitle(key) ?? fmtLabel(String(key).split('/').pop()); }

// ── flowchart parser ──────────────────────────────────────
function parseFlowchart(raw) {
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('%%'));
  let rankdir = 'LR';
  const nodesMap = new Map(), edges = [], classOf = {};

  function cleanLabel(s) { return s.replace(/<br\s*\/?>/gi, '\n').replace(/\\n/g, '\n'); }
  function refFromLabel(label) {
    // Detect @class-name at start of label (e.g. "@channel-system" or "@auth-flow\nsome path")
    const m = label.match(/^@([\w-]+)/);
    return m ? m[1] : null;
  }
  function tok(t) {
    t = t.trim();
    let m;
    m = t.match(/^(@?[\w-]+)\["([^"]+)"\]$/); if (m) { const lbl=cleanLabel(m[2]),r=refFromLabel(lbl),idR=m[1].startsWith('@'); return {id:m[1].replace(/^@/,''),label:lbl,shape:'rect',isRef:idR||!!r,refTarget:r||(idR?m[1].replace(/^@/,''):null)}; }
    m = t.match(/^(@?[\w-]+)\[([^\]]+)\]$/);  if (m) { const lbl=cleanLabel(m[2]),r=refFromLabel(lbl),idR=m[1].startsWith('@'); return {id:m[1].replace(/^@/,''),label:lbl,shape:'rect',isRef:idR||!!r,refTarget:r||(idR?m[1].replace(/^@/,''):null)}; }
    m = t.match(/^(@?[\w-]+)\(\(([^)]+)\)\)$/); if (m) { const lbl=cleanLabel(m[2]),r=refFromLabel(lbl),idR=m[1].startsWith('@'); return {id:m[1].replace(/^@/,''),label:lbl,shape:'stadium',isRef:idR||!!r,refTarget:r||(idR?m[1].replace(/^@/,''):null)}; }
    m = t.match(/^(@?[\w-]+)\(([^)]+)\)$/);   if (m) { const lbl=cleanLabel(m[2]),r=refFromLabel(lbl),idR=m[1].startsWith('@'); return {id:m[1].replace(/^@/,''),label:lbl,shape:'round',isRef:idR||!!r,refTarget:r||(idR?m[1].replace(/^@/,''):null)}; }
    m = t.match(/^(@?[\w-]+)\{([^}]+)\}$/);   if (m) { const lbl=cleanLabel(m[2]),r=refFromLabel(lbl),idR=m[1].startsWith('@'); return {id:m[1].replace(/^@/,''),label:lbl,shape:'diamond',isRef:idR||!!r,refTarget:r||(idR?m[1].replace(/^@/,''):null)}; }
    if (/^@?[\w-]+$/.test(t)) { const id=t.replace(/^@/,''); return {id,label:id,shape:'rect',isRef:t.startsWith('@')}; }
    return null;
  }

  // Edge pattern: A --> B, A -->|label| B, A -- "label" --> B, etc.
  const edgeLineRe = /^(.+?)\s+--\s+"([^"]+)"\s+-->\s+(.+)$/;
  const arrowRe = /(-->(?:\|[^|]*\|)?|--o|--x|---|-.->|==>|~~>)/;
  for (const line of lines) {
    const dir = line.match(/^(?:graph|flowchart)\s+([A-Z]{2})/i);
    if (dir) { const d=dir[1].toUpperCase(); rankdir=(d==='TD'||d==='TB')?'TB':d; continue; }
    if (/^(classDef|click |style |linkStyle|subgraph|end$)/i.test(line)) continue;
    const ca = line.match(/^class\s+([\w\-,\s]+)\s+(\w+)$/);
    if (ca) { ca[1].split(',').map(s=>s.trim()).forEach(id=>classOf[id]=ca[2]); continue; }
    // Try "-- label -->" syntax first (e.g., APP -- "HTTP API" --> SERVER)
    const labelEdge = line.match(edgeLineRe);
    if (labelEdge) {
      const src=tok(labelEdge[1]), dst=tok(labelEdge[3]);
      if (src&&dst) {
        if (!nodesMap.has(src.id)) nodesMap.set(src.id,src);
        if (!nodesMap.has(dst.id)) nodesMap.set(dst.id,dst);
        edges.push({from:src.id,to:dst.id,label:labelEdge[2].replace(/<br\s*\/?>/gi,' ')});
      }
      continue;
    }
    const parts = line.split(arrowRe);
    if (parts.length >= 3) {
      const src=tok(parts[0]), dst=tok(parts[2]);
      if (src&&dst) {
        if (!nodesMap.has(src.id)) nodesMap.set(src.id,src);
        if (!nodesMap.has(dst.id)) nodesMap.set(dst.id,dst);
        const lm=parts[1].match(/\|([^|]+)\|/);
        edges.push({from:src.id,to:dst.id,label:lm?lm[1].replace(/<br\s*\/?>/gi,' '):''});
      }
    } else {
      const n=tok(line); if (n&&!nodesMap.has(n.id)) nodesMap.set(n.id,n);
    }
  }
  for (const [id,cls] of Object.entries(classOf)) { const n=nodesMap.get(id); if (n) n.cls=cls; }
  return {rankdir, nodes:[...nodesMap.values()], edges};
}

// ── node style ────────────────────────────────────────────
function nodeStyle(node) {
  const c = node.cls||'';
  if (isDark) {
    if (c==='external') return {bg:'#0a0a0a',border:'#666666',dash:null,text:'#cccccc'};
    if (c==='lib')      return {bg:'#0a0a0a',border:'#666666',dash:null, text:'#cccccc'};
    return                    {bg:'#0a0a0a',border:'#666666',dash:null, text:'#ffffff'};
  } else {
    if (c==='external') return {bg:'#e0e0e0',border:'#bbb',dash:null,text:'#64748b'};
    if (c==='lib')      return {bg:'#e8e8e8',border:'#c0c0c0',dash:null, text:'#553388'};
    return                    {bg:'#f0f0f0',border:'#999',    dash:null, text:'#1a1a1a'};
  }
}

// ── smooth path through all Dagre waypoints ───────────────
// Uses quadratic bezier spline so edges respect Dagre's obstacle routing
function smoothPath(pts) {
  if (!pts || pts.length < 2) return '';
  if (pts.length === 2) {
    // Simple S-curve for two-point edges
    const [a, b] = pts;
    const mx = r1((a.x+b.x)/2), my = r1((a.y+b.y)/2);
    return `M${r1(a.x)},${r1(a.y)} C${mx},${r1(a.y)} ${mx},${r1(b.y)} ${r1(b.x)},${r1(b.y)}`;
  }
  // Quadratic bezier spline: smooth through all waypoints
  let d = `M${r1(pts[0].x)},${r1(pts[0].y)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const mid = { x: (pts[i].x + pts[i+1].x) / 2, y: (pts[i].y + pts[i+1].y) / 2 };
    d += ` Q${r1(pts[i].x)},${r1(pts[i].y)} ${r1(mid.x)},${r1(mid.y)}`;
  }
  const last = pts[pts.length-1];
  d += ` L${r1(last.x)},${r1(last.y)}`;
  return d;
}

// ── render one class group (recursive) ────────────────────
// _expandedGlobal prevents same class from expanding in multiple branches
let _expandedGlobal = new Set();

function renderGroup(cls, classesData, allClasses, level, seen = new Set(), scopedPath) {
  if (seen.has(cls)) return null;
  seen = new Set(seen); seen.add(cls);
  if (!scopedPath) scopedPath = cls; // level 0: scopedPath = perspective name
  let labelOverlay = ''; // centered labels for sub-groups, rendered outside grp-inner

  const data = classesData[cls];
  if (!data?.diagram) return null;

  const parsed = parseFlowchart(data.diagram);
  const {rankdir, nodes, edges} = parsed;
  if (!nodes.length) return null;

  // padding around the group content
  const PAD_L = 16, PAD_R = 20, PAD_T = 20, PAD_B = 16;

  // For level 0: expand @ref nodes as sub-groups
  const subGroups = {}; // nodeId -> { cls, W, H, svgContent }
  const nodeDims  = {}; // nodeId -> { width, height }

  // Determine children of current element for subgroup resolution
  const currentChildren = (level === 0 ? (childrenByPerspective[cls] || []) : (classesData[cls]?.children || []));

  for (const n of nodes) {
    // Resolve subgroup: @ref (legacy) OR node ID is a child of current element with its own diagram
    const refCls = n.isRef ? (n.refTarget || n.id) : (currentChildren.includes(n.id) && classesData[n.id]?.diagram ? n.id : null);
    if (level < maxDepth && refCls && classesData[refCls]?.diagram && !seen.has(refCls) && !_expandedGlobal.has(refCls)) {
      _expandedGlobal.add(refCls);
      const childScopedPath = scopedPath + '/' + refCls;
      const sub = renderGroup(refCls, classesData, allClasses, level+1, seen, childScopedPath);
      if (sub) {
        // Scale down to fit max box. At small scales, edge overflow becomes negligible.
        const MAX_W = 320, MAX_H = 220, PAD = 12;
        const fs = Math.min((MAX_W - PAD*2) / sub.W, (MAX_H - PAD*2) / sub.H, 1);
        subGroups[n.id] = { cls: refCls, scopedPath: childScopedPath, ...sub, fitScale: fs };
        nodeDims[n.id] = { width: sub.W * fs + PAD * 2, height: sub.H * fs + PAD * 2 };
      }
    }
    if (!nodeDims[n.id]) {
      const lbl = n.label.replace(/^@/,'');
      const [mainLbl] = lbl.split('\n');
      const hasPath = lbl.includes('\n');
      const maxW = nodes.length > 10 ? 160 : 220;
      const w = Math.min(maxW, Math.max(80, tw(mainLbl, '12px Inter,system-ui') + 44));
      const baseH = n.shape==='diamond' ? 42 : 38;
      nodeDims[n.id] = {width: w, height: hasPath ? baseH + 14 : baseH};
    }
  }

  // Pre-process: identify fan-out groups for compact grid layout
  const maxPerRow = 3;
  const _gridGroups = {};  // virtualId -> { parentId, children[], cols, cellW, cellH }
  const _gridExcluded = new Set();  // node IDs replaced by virtual nodes
  const _gridPositions = {};  // childId -> { x, y } (filled after dagre)

  for (const n of nodes) {
    const outEdges = edges.filter(e => e.from === n.id);
    const leafTargets = outEdges
      .map(e => e.to)
      .filter(tid => !edges.some(e2 => e2.from === tid) && !subGroups[tid]);
    if (leafTargets.length > maxPerRow) {
      const cols = maxPerRow;
      const rows = Math.ceil(leafTargets.length / cols);
      const maxCW = Math.max(...leafTargets.map(id => nodeDims[id].width));
      const maxCH = Math.max(...leafTargets.map(id => nodeDims[id].height));
      const cellW = maxCW + 16;
      const cellH = maxCH + 10;
      const vid = `__grid_${n.id}`;
      _gridGroups[vid] = { parentId: n.id, children: leafTargets, cols, cellW, cellH };
      nodeDims[vid] = { width: cols * cellW, height: rows * cellH };
      leafTargets.forEach(id => _gridExcluded.add(id));
    }
  }

  // Dagre layout with virtual grid nodes
  const dense = nodes.length > 10;
  function buildGraph(rd) {
    const g = new dagre.graphlib.Graph();
    const nsep = dense ? 20 : 32;
    const rsep = dense ? 28 : 44;
    g.setGraph({rankdir: rd, nodesep:nsep, ranksep:rsep, marginx:PAD_L, marginy:PAD_T});
    g.setDefaultEdgeLabel(() => ({}));
    for (const n of nodes) {
      if (!_gridExcluded.has(n.id)) g.setNode(n.id, nodeDims[n.id]);
    }
    for (const vid of Object.keys(_gridGroups)) g.setNode(vid, nodeDims[vid]);
    const _addedVirtEdges = new Set();
    for (const e of edges) {
      let from = e.from, to = e.to;
      if (_gridExcluded.has(from)) continue;
      if (_gridExcluded.has(to)) {
        const vEntry = Object.entries(_gridGroups).find(([,gr]) => gr.children.includes(to));
        if (!vEntry) continue;
        to = vEntry[0];
        const ek = `${from}->${to}`;
        if (_addedVirtEdges.has(ek)) continue;
        _addedVirtEdges.add(ek);
      }
      if (g.hasNode(from) && g.hasNode(to)) g.setEdge(from, to, {label: e.label});
    }
    try { dagre.layout(g); return g; } catch { return null; }
  }

  let g = buildGraph(rankdir);
  if (!g) return null;
  const gi0 = g.graph();
  const aspectThreshold = nodes.length > 12 ? 1.4 : nodes.length > 7 ? 1.6 : 2.0;
  if (gi0.width > 0 && gi0.height > 0 && gi0.width / gi0.height > aspectThreshold && rankdir !== 'TB') {
    const gTB = buildGraph('TB');
    if (gTB) g = gTB;
  }

  // Expand virtual grid nodes into child positions
  for (const [vid, group] of Object.entries(_gridGroups)) {
    const vNode = g.node(vid);
    if (!vNode) continue;
    const { children, cols, cellW, cellH } = group;
    const rows = Math.ceil(children.length / cols);
    const startX = vNode.x - ((cols - 1) * cellW) / 2;
    const startY = vNode.y - ((rows - 1) * cellH) / 2;
    children.forEach((childId, i) => {
      _gridPositions[childId] = {
        x: startX + (i % cols) * cellW,
        y: startY + Math.floor(i / cols) * cellH
      };
    });
  }

  const gi = g.graph();
  const W = r1(gi.width + PAD_R);
  const H = r1(gi.height + PAD_B);

  const uid = `${cls.replace(/[^a-z0-9]/gi,'')}_l${level}_`;
  const th = theme();
  let svg = '';

  // edges
  edges.forEach((e,i) => {
    if (_gridExcluded.has(e.from)) return; // skip edges from grid children
    let pts, d, mid;
    const srcPos = g.node(e.from) || _gridPositions[e.from];
    const tgtPos = _gridPositions[e.to] || g.node(e.to);
    if (!srcPos || !tgtPos) return;
    if (_gridPositions[e.to]) {
      // Edge to grid child: direct path from parent to child grid position
      const mx = (srcPos.x + tgtPos.x) / 2, my = (srcPos.y + tgtPos.y) / 2;
      pts = [{x:srcPos.x,y:srcPos.y},{x:mx,y:my},{x:tgtPos.x,y:tgtPos.y}];
      d = smoothPath(pts);
      mid = {x:mx, y:my};
    } else {
      const ed = g.edge(e.from, e.to); if (!ed?.points?.length) return;
      pts = ed.points;
      d = smoothPath(pts);
      mid = pts[Math.floor(pts.length/2)];
    }
    const ec = th.edgeColor0;
    const mk = `${uid}m${i}`;
    svg += `<defs><marker id="${mk}" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L0,4.5 L6,2.5 z" fill="${ec}"/></marker></defs>
      <path class="edge-path" d="${d}" stroke="${ec}" stroke-width="2" fill="none" marker-end="url(#${mk})" data-from="${esc(e.from)}" data-to="${esc(e.to)}"/>`;
    if (e.label) {
      const lw = tw(e.label,'9px Inter')+8;
      const mx=r1(mid.x), my=r1(mid.y);
      svg += `<g class="edge-label"><rect x="${mx-lw/2}" y="${my-6}" width="${lw}" height="12" rx="2" fill="${th.edgeLabelBg}"/>
        <text x="${mx}" y="${my+3}" text-anchor="middle" font-family="Inter,system-ui" font-size="9" fill="${th.edgeLabelText}">${esc(e.label)}</text></g>`;
    }
  });

  // nodes
  for (const n of nodes) {
    const pos = _gridPositions[n.id] || g.node(n.id); if (!pos) continue;
    const dim = nodeDims[n.id];
    const nx = r1(pos.x - dim.width/2);
    const ny = r1(pos.y - dim.height/2);
    const sg = subGroups[n.id];

    if (sg) {
      // ── sub-group: dashed boundary + nested content ──
      const safeId = esc(sg.cls); // short name for display
      const scopedId = esc(sg.scopedPath || sg.cls); // full path for selection
      const refSubStroke = th.subStroke;
      const fs = sg.fitScale;
      const PAD = 12;
      const boxW = sg.W * fs + PAD * 2, boxH = sg.H * fs + PAD * 2;
      const clipId = `${uid}clip_${n.id}`;
      svg += `<defs><clipPath id="${clipId}"><rect x="-2" y="-16" width="${r1(boxW+4)}" height="${r1(boxH+18)}" rx="6"/></clipPath></defs>`;
      svg += `<g class="grp-node" clip-path="url(#${clipId})" onclick="event.stopPropagation();window.__openSb('${scopedId}')" data-cls="${scopedId}" data-depth="${level+1}" transform="translate(${nx},${ny})">`;
      svg += `<rect class="grp-border" width="${r1(boxW)}" height="${r1(boxH)}" rx="5"
        fill="${th.subFill}" stroke="${refSubStroke}" stroke-width="2"/>`;
      const _slW = tw(displayTitle(sg.scopedPath || sg.cls), '600 9px "Plus Jakarta Sans",Inter,system-ui') + 12;
      svg += `<rect class="grp-label-top grp-label-bg" x="5" y="-7" width="${_slW}" height="14" rx="2" fill="${th.subFill}" opacity="1"/>`;
      svg += `<text class="grp-label-top" x="10" y="2" font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="9" font-weight="600"
        fill="${th.subLabelFill}" letter-spacing="0.05em">${esc(displayTitle(sg.scopedPath || sg.cls))}</text>`;
      svg += `<g class="grp-inner" transform="translate(${r1(PAD)},${r1(PAD)}) scale(${r1(fs)})">${sg.svgContent}</g>`;
      svg += `<text class="grp-label-center" x="${r1(boxW/2)}" y="${r1(boxH/2)}" text-anchor="middle" dominant-baseline="central"
        font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="9" font-weight="600" fill="${th.grpLabelCenterFill}" letter-spacing="0.05em">${esc(displayTitle(sg.scopedPath || sg.cls))}</text>`;
      svg += `</g>`;
      labelOverlay += `<text class="grp-label-center" x="${r1(nx + boxW/2)}" y="${r1(ny + boxH/2)}" text-anchor="middle" dominant-baseline="central"
        font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="9" font-weight="600" fill="${th.grpLabelCenterFill}" letter-spacing="0.05em">${esc(displayTitle(sg.scopedPath || sg.cls))}</text>`;
    } else {
      // ── regular node ──
      const st = nodeStyle(n);
      if (n.label.startsWith('@')) {
        // @ref nodes keep same border as default (white)
        // @ref nodes keep solid border
      }
      const da = st.dash ? `stroke-dasharray="${st.dash}"` : '';
      const rawLbl = n.label.replace(/^@/,'');
      const [mainLbl, pathLbl] = rawLbl.split('\n');
      const cx = r1(pos.x), cy = r1(pos.y);
      const fs = 12;
      const nodeScopedId = esc(scopedPath + '/' + n.id);
      let shape = '';
      if (n.shape==='diamond') {
        shape = `<polygon class="nshape" points="${cx},${ny} ${nx+dim.width},${cy} ${cx},${ny+dim.height} ${nx},${cy}"
          fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
      } else if (n.shape==='stadium'||n.shape==='round') {
        shape = `<rect class="nshape" x="${nx}" y="${ny}" width="${dim.width}" height="${dim.height}"
          rx="${dim.height/2}" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
      } else {
        shape = `<rect class="nshape" x="${nx}" y="${ny}" width="${dim.width}" height="${dim.height}"
          rx="4" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
      }
      if (pathLbl) {
        svg += `<g class="reg-node" data-cls="${nodeScopedId}" onclick="event.stopPropagation();window.__openSb('${nodeScopedId}')">${shape}
          <text class="node-lbl" x="${cx}" y="${r1(cy - 7)}" text-anchor="middle" dominant-baseline="central"
            font-family="Inter,system-ui,sans-serif" font-size="${fs}" fill="${st.text}">${esc(mainLbl)}</text>
          <text class="node-path" x="${cx}" y="${r1(cy + 7)}" text-anchor="middle" dominant-baseline="central"
            font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="${st.text}" opacity="0.45">${esc(pathLbl)}</text>
        </g>`;
      } else {
        svg += `<g class="reg-node" data-cls="${nodeScopedId}" onclick="event.stopPropagation();window.__openSb('${nodeScopedId}')">${shape}
          <text class="node-lbl" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
            font-family="Inter,system-ui,sans-serif" font-size="${fs}" fill="${st.text}">${esc(mainLbl)}</text>
        </g>`;
      }
    }
  }

  return { svgContent: svg, W, H, labelOverlay };
}

// ── sidebar diagram renderer (flat, for sidebar only) ─────
function renderFlatSVG(text) {
  if (!text) return null;
  let parsed; try { parsed = parseFlowchart(text); } catch { return null; }
  const {rankdir, nodes, edges} = parsed;
  if (!nodes.length) return null;
  const g = new dagre.graphlib.Graph();
  g.setGraph({rankdir, nodesep:36, ranksep:48, marginx:18, marginy:14});
  g.setDefaultEdgeLabel(() => ({}));
  const dims = {};
  for (const n of nodes) {
    const lbl = n.label.replace(/^@/,'');
    const [mainLbl] = lbl.split('\n');
    const hasPath = lbl.includes('\n');
    const w = Math.min(180,Math.max(60,tw(mainLbl,'11px Inter,system-ui')+28));
    const h = (n.shape==='diamond'?34:28) + (hasPath ? 12 : 0);
    dims[n.id]={w,h}; g.setNode(n.id,{width:w,height:h});
  }
  for (const e of edges) { if (g.hasNode(e.from)&&g.hasNode(e.to)) g.setEdge(e.from,e.to,{label:e.label}); }
  try { dagre.layout(g); } catch { return null; }
  const gi = g.graph();
  const W = r1((gi.width||150)+36), H = r1((gi.height||80)+28);
  let edg='', nds='';
  const sth = theme();
  edges.forEach((e,i) => {
    const ed=g.edge(e.from,e.to); if (!ed?.points?.length) return;
    const pts=ed.points, d=smoothPath(pts);
    const mid=pts[Math.floor(pts.length/2)];
    const mk=`sbm${i}${Math.random().toString(36).slice(2,5)}`;
    edg+=`<defs><marker id="${mk}" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L0,4.5 L6,2.5 z" fill="${sth.edgeColor0}"/></marker></defs>
      <path class="edge-path" d="${d}" stroke="${sth.edgeColor0}" stroke-width="2" fill="none" marker-end="url(#${mk})" data-from="${esc(e.from)}" data-to="${esc(e.to)}"/>`;
    if (e.label) {
      const lw=tw(e.label,'9px Inter')+8, mx=r1(mid.x), my=r1(mid.y);
      edg+=`<rect x="${mx-lw/2}" y="${my-6}" width="${lw}" height="12" rx="2" fill="${sth.edgeLabelBg}"/>
        <text x="${mx}" y="${my+3}" text-anchor="middle" font-family="Inter,system-ui" font-size="9" fill="${sth.edgeLabelText}">${esc(e.label)}</text>`;
    }
  });
  for (const n of nodes) {
    const pos=g.node(n.id); if (!pos) continue;
    const {w,h}=dims[n.id];
    const nx=r1(pos.x-w/2), ny=r1(pos.y-h/2), cx=r1(pos.x), cy=r1(pos.y);
    const st=nodeStyle(n), da=st.dash?`stroke-dasharray="${st.dash}"`:'';
    const rawLbl=n.label.replace(/^@/,'');
    const [mainLbl, pathLbl]=rawLbl.split('\n');
    let shape='';
    if (n.shape==='diamond') shape=`<polygon points="${cx},${ny} ${nx+w},${cy} ${cx},${ny+h} ${nx},${cy}" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
    else if (n.shape==='stadium'||n.shape==='round') shape=`<rect x="${nx}" y="${ny}" width="${w}" height="${h}" rx="${h/2}" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
    else shape=`<rect x="${nx}" y="${ny}" width="${w}" height="${h}" rx="4" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
    if (pathLbl) {
      nds+=`<g>${shape}
        <text x="${cx}" y="${r1(cy-6)}" text-anchor="middle" dominant-baseline="central"
          font-family="Inter,system-ui" font-size="11" fill="${st.text}">${esc(mainLbl)}</text>
        <text x="${cx}" y="${r1(cy+6)}" text-anchor="middle" dominant-baseline="central"
          font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="${st.text}" opacity="0.45">${esc(pathLbl)}</text>
      </g>`;
    } else {
      nds+=`<g>${shape}<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
        font-family="Inter,system-ui" font-size="11" fill="${st.text}">${esc(mainLbl)}</text></g>`;
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible" xmlns="http://www.w3.org/2000/svg">${edg}${nds}</svg>`;
}

// ── canvas pan/zoom ───────────────────────────────────────
const canvasWrap = document.getElementById('canvas-wrap');
const canvasEl   = document.getElementById('canvas');
const sidebar    = document.getElementById('sidebar');
const sbTitle    = document.getElementById('sb-title');
const sbDiagram  = document.getElementById('sb-diagram');
const sbFields   = document.getElementById('sb-fields');
const zoomLabel  = document.getElementById('zoom-label');
const navTitle   = document.getElementById('nav-title');
const navList    = document.getElementById('nav-list');

let vpX=0, vpY=0, vpScale=0.7;
let classes=[], classesData={}, refsData={};
let selectedCls=null, svgW=0, svgH=0;
const maxDepth = 6;  // always render all depths; visibility controlled per-group by CSS

const api = p => fetch(p).then(r=>r.json()).catch(()=>({}));

// ── transform ──────────────────────────────────────────────
const MIN_SCALE = 0.02, MAX_SCALE = 30;

function applyTransform() {
  canvasEl.style.transform=`translate(${vpX}px,${vpY}px) scale(${vpScale})`;
  const pct = Math.round(vpScale*100);
  zoomLabel.textContent = pct >= 1000 ? `${(pct/100).toFixed(0)}k%` : `${pct}%`;

  // Scale-compensated group labels: keep ~13px rendered size
  const targetPx = 13;
  const fs = Math.min(72, Math.max(10, targetPx / vpScale));
  const fsStr = (Math.round(fs * 10) / 10).toString();
  const labelFill = isDark ? (vpScale < 0.5 ? '#ccc' : '#cbd5e1') : (vpScale < 0.5 ? '#333' : '#475569');
  document.querySelectorAll('#canvas .grp-label-top').forEach(el => {
    if (el.tagName === 'text') {
      el.setAttribute('font-size', fsStr);
      el.setAttribute('fill', labelFill);
    } else if (el.classList.contains('grp-label-bg')) {
      // Scale background rect height to match font-size
      el.setAttribute('height', String(Math.round(fs * 1.5)));
    }
  });
  // Center label: keep ~20px rendered size in overview
  const fsCtr = Math.min(120, Math.max(14, 20 / vpScale));
  const fsCtrStr = (Math.round(fsCtr * 10) / 10).toString();
  document.querySelectorAll('#canvas .grp-label-center').forEach(el => {
    el.setAttribute('font-size', fsCtrStr);
  });
  // Scale-compensated node labels: keep ~11px rendered size at any zoom level
  const fsNode = Math.min(60, Math.max(11, 11 / vpScale));
  const fsNodeStr = (Math.round(fsNode * 10) / 10).toString();
  document.querySelectorAll('#canvas .node-lbl').forEach(el => {
    el.setAttribute('font-size', fsNodeStr);
  });

  canvasWrap.classList.toggle('zoom-overview', vpScale < 0.42);

  // Viewport-relative expansion: measure group's own border rect
  const vpW = canvasWrap.clientWidth;
  document.querySelectorAll('#canvas [data-depth]').forEach(el => {
    const border = el.querySelector(':scope > .grp-border');
    if (!border) return;
    const rect = border.getBoundingClientRect();
    const depth = parseInt(el.getAttribute('data-depth') || '0', 10);

    // Collapse: hide inner content when group is too small on screen (progressive reveal)
    const collapseThreshold = vpW * 0.275;  // 27.5% of canvas viewport width
    const collapsed = rect.width < collapseThreshold;
    el.classList.toggle('grp-collapsed', collapsed);

    // Expansion: label switching (existing logic)
    // Root=50%, depth1=65%, depth2=80% of viewport width to expand
    const threshold = 0.5 + depth * 0.15;
    const expanded = rect.width >= vpW * threshold;
    el.classList.toggle('grp-expanded', expanded);
  });

}

function zoomTo(newScale, originX, originY) {
  const s = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
  const cW = canvasWrap.clientWidth, cH = canvasWrap.clientHeight;
  const cx = originX ?? cW/2, cy = originY ?? cH/2;
  vpX = cx - (cx - vpX) * (s / vpScale);
  vpY = cy - (cy - vpY) * (s / vpScale);
  vpScale = s;
  applyTransform();
}

function centerView() {
  if (!svgW) return;
  const cW=canvasWrap.clientWidth, cH=canvasWrap.clientHeight;
  const s = Math.min(0.9, (cW-80)/svgW, (cH-80)/svgH);
  vpScale = s;
  vpX = cW/2 - (svgW/2)*s;
  vpY = cH/2 - (svgH/2)*s;
  applyTransform();
}

window.zoomIn    = () => zoomTo(vpScale * 1.25);
window.zoomOut   = () => zoomTo(vpScale / 1.25);
window.resetView = centerView;

// ── animated transition ────────────────────────────────────
let _raf = null;
function animateTo(toX, toY, toScale, duration=380) {
  if (_raf) cancelAnimationFrame(_raf);
  const fromX = vpX, fromY = vpY, fromS = vpScale;
  const t0 = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - t0) / duration);
    const e = 1 - Math.pow(1 - t, 3); // ease-out cubic
    vpX = fromX + (toX - fromX) * e;
    vpY = fromY + (toY - fromY) * e;
    vpScale = fromS + (toScale - fromS) * e;
    applyTransform();
    if (t < 1) _raf = requestAnimationFrame(frame);
  }
  _raf = requestAnimationFrame(frame);
}

function focusGroup(cls) {
  // Mark focused group as exempt from blur
  document.querySelectorAll('#canvas [data-cls].focus-exempt').forEach(el => el.classList.remove('focus-exempt'));
  const el = document.querySelector(`#canvas [data-cls="${CSS.escape(cls)}"]`);
  if (!el) return;
  el.classList.add('focus-exempt');
  // Also exempt all ancestor groups so parent blur doesn't hide focused child
  let ancestor = el.parentElement;
  while (ancestor) {
    if (ancestor.hasAttribute && ancestor.hasAttribute('data-cls')) {
      ancestor.classList.add('focus-exempt');
    }
    ancestor = ancestor.parentElement;
  }

  // Use the group's border rect for accurate dimensions
  const border = el.querySelector(':scope > .grp-border') || el;
  const rect = border.getBoundingClientRect();
  const wrapRect = canvasWrap.getBoundingClientRect();

  // Convert screen coords to SVG space
  const svgCenterX = (rect.left + rect.width/2 - wrapRect.left - vpX) / vpScale;
  const svgCenterY = (rect.top + rect.height/2 - wrapRect.top - vpY) / vpScale;
  const svgW = rect.width / vpScale;
  const svgH = rect.height / vpScale;

  // Available viewport (account for sidebar: right panel on desktop, bottom drawer on mobile)
  const isMobile = window.innerWidth <= 768;
  const sbW = (!isMobile && sidebar.classList.contains('open')) ? 400 : 0;
  const sbH = (isMobile && sidebar.classList.contains('open')) ? window.innerHeight * 0.5 : 0;
  const availW = canvasWrap.clientWidth - sbW - 60;
  const availH = canvasWrap.clientHeight - sbH - 60;

  // Target scale to fit element with padding
  const targetScale = Math.min(MAX_SCALE, Math.max(0.15, Math.min(availW / svgW, availH / svgH) * 0.85));

  // Center in available viewport (account for sidebar/drawer)
  const centerX = (canvasWrap.clientWidth - sbW) / 2;
  const centerY = (canvasWrap.clientHeight - sbH) / 2;
  const toX = centerX - svgCenterX * targetScale;
  const toY = centerY - svgCenterY * targetScale;

  animateTo(toX, toY, targetScale);
}

// ── wheel: Figma-style ─────────────────────────────────────
// trackpad two-finger scroll → pan
// trackpad pinch (ctrlKey) / Ctrl+mousewheel → zoom
canvasWrap.addEventListener('wheel', e => {
  e.preventDefault();
  clearFocusExempt();

  if (e.ctrlKey || e.metaKey) {
    // Zoom — trackpad pinch gives pixel deltas, mouse wheel gives line deltas
    let factor;
    if (e.deltaMode === 0) {
      // trackpad pinch: more responsive
      factor = Math.pow(0.993, e.deltaY);
    } else {
      // mouse wheel: snappier step
      factor = e.deltaY < 0 ? 1.22 : 1/1.22;
    }
    zoomTo(vpScale * factor, e.clientX, e.clientY);
  } else {
    // Pan — respect both axes (trackpad two-finger swipe)
    vpX -= e.deltaX;
    vpY -= e.deltaY;
    applyTransform();
  }
}, { passive: false });

// ── pan: space+drag, middle-mouse, empty-area drag ─────────
let spaceHeld = false;
let panning = false, panA = {}, panV = {};

function updateCursor() {
  if (panning)      canvasWrap.style.cursor = 'grabbing';
  else if (spaceHeld) canvasWrap.style.cursor = 'grab';
  else              canvasWrap.style.cursor = '';
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' && document.activeElement === document.body) {
    e.preventDefault();
    spaceHeld = true;
    updateCursor();
  }
  // Figma keyboard shortcuts
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey) {
    if (e.key === '0') { e.preventDefault(); centerView(); }
    if (e.key === '1') { e.preventDefault(); zoomTo(1); }
    if (e.key === '2') { e.preventDefault(); zoomTo(2); }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); window.zoomIn(); }
    if (e.key === '-') { e.preventDefault(); window.zoomOut(); }
  }
  if (e.target.closest?.('input, textarea')) return;
  if (e.key === 'Escape') { if (activeGuide) exitGuide(); closeSidebar(); }
  if (activeGuide && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (e.key === 'ArrowRight') { e.preventDefault(); nextGuideStep(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goToGuideStep(guideStep - 1); }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { spaceHeld = false; updateCursor(); }
});

canvasWrap.addEventListener('mousedown', e => {
  const isMiddle   = e.button === 1;
  const isSpaceDrag = e.button === 0 && spaceHeld;
  const isEmptyDrag = e.button === 0 && !spaceHeld &&
    !e.target.closest('.grp-node') && !e.target.closest('.reg-node');

  if (isMiddle || isSpaceDrag || isEmptyDrag) {
    e.preventDefault();
    panning = true;
    panA = { x: e.clientX, y: e.clientY };
    panV = { x: vpX, y: vpY };
    updateCursor();
  }
});

window.addEventListener('mousemove', e => {
  if (!panning) return;
  vpX = panV.x + (e.clientX - panA.x);
  vpY = panV.y + (e.clientY - panA.y);
  applyTransform();
});

window.addEventListener('mouseup', () => {
  if (panning) { panning = false; updateCursor(); }
});

// Touch: pan + pinch zoom
(function() {
  var touchStart = null, touchDist = null, touchScale = null;
  canvasWrap.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, vpX: vpX, vpY: vpY };
    } else if (e.touches.length === 2) {
      touchStart = null;
      var dx = e.touches[1].clientX - e.touches[0].clientX;
      var dy = e.touches[1].clientY - e.touches[0].clientY;
      touchDist = Math.hypot(dx, dy);
      touchScale = vpScale;
    }
  }, { passive: true });
  canvasWrap.addEventListener('touchmove', function(e) {
    if (e.touches.length === 1 && touchStart) {
      e.preventDefault();
      vpX = touchStart.vpX + (e.touches[0].clientX - touchStart.x);
      vpY = touchStart.vpY + (e.touches[0].clientY - touchStart.y);
      applyTransform();
    } else if (e.touches.length === 2 && touchDist) {
      e.preventDefault();
      var dx = e.touches[1].clientX - e.touches[0].clientX;
      var dy = e.touches[1].clientY - e.touches[0].clientY;
      var newDist = Math.hypot(dx, dy);
      var scale = touchScale * (newDist / touchDist);
      vpScale = Math.min(10, Math.max(0.05, scale));
      applyTransform();
    }
  }, { passive: false });
  canvasWrap.addEventListener('touchend', function() {
    touchStart = null; touchDist = null; touchScale = null;
  });
})();

// close sidebar when clicking empty canvas area
canvasWrap.addEventListener('click', e => {
  if (!e.target.closest('[onclick]')) closeSidebar();
});

// ── sidebar ───────────────────────────────────────────────
window.__openSb = function(cls, frameCls) {
  // Resolve: try full scoped path, then short name, then fallback to parent perspective
  var shortName = cls.includes('/') ? cls.split('/').pop() : cls;
  var dataKey = classesData[cls] ? cls : (classesData[shortName] ? shortName : null);
  if (!dataKey && cls.includes('/')) {
    // Fallback: show parent perspective for nodes without their own element data
    dataKey = cls.split('/')[0];
  }
  if (!dataKey || !classesData[dataKey]) return;
  // highlight using scoped cls for DOM, dataKey for data
  document.querySelectorAll('.grp-node,.reg-node').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll(`[data-cls="${CSS.escape(cls)}"]`).forEach(el=>el.classList.add('selected'));
  selectedCls=cls;
  const onStep = !!(activeGuide && cls === activeGuide.guide.steps[guideStep].element);
  sbStep.hidden = !onStep;
  // Coming back to the step's element opens on its explanation.
  if (onStep) sidebar.classList.remove('show-full');
  setGuidePanel(onStep);
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-nav') === cls);
  });
  var sidebarAlreadyOpen = sidebar.classList.contains('open');
  openSidebar(dataKey);
  if (sidebarAlreadyOpen) {
    focusGroup(frameCls || cls);
  } else {
    setTimeout(() => focusGroup(frameCls || cls), 260);
  }
  // Cloud mode: notify parent frame of selection
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'class-selected', className: cls }, '*');
  }
};

function openSidebar(cls) {
  const data=classesData[cls]||{}, refs=refsData[cls]||{};
  sbTitle.textContent=displayTitle(cls);
  sbDiagram.innerHTML = '';
  const md=t=>t?marked.parse(t):'';
  const sec=(title,body,ex='')=>body?`<div class="sb-sec ${ex}"><div class="sb-sec-title">${title}</div><div class="sb-sec-body">${body}</div></div>`:'';
  let html='';
  if (data.meta) {
    const when=data.meta.updated?new Date(data.meta.updated).toLocaleString(document.documentElement.lang):'';
    const n=data.meta.update_count||0;
    const updates=t(n===1?'updatesOne':'updatesOther',{n});
    html+=`<div class="sb-sec"><div class="sb-sec-title">${esc(t('meta'))}</div><div class="sb-meta-text">${when?esc(when)+'<br>':''}${esc(updates)}${data.meta.git_branch?` · ${esc(data.meta.git_branch)}`:''}${data.meta.git_commit?` · ${esc(data.meta.git_commit)}`:''}</div></div>`;
  }
  html+=sec(esc(t('description')),md(data.description));
  html+=sec(esc(t('constraint')),md(data.constraint));
  html+=sec(esc(t('concern')),md(data.concern),'sb-concern');
  html+=sec(esc(t('context')),md(data.context));
  html+=sec(esc(t('todo')),md(data.todo));
  html+=sec(esc(t('note')),md(data.note));
  const inc=refs.incoming||[], out=refs.outgoing||[];
  if (inc.length||out.length) {
    const links=[
      ...inc.map(r=>{const n=typeof r==='string'?r:r.source_class;return `<span class="sb-ref" onclick="window.__openSb('${esc(n)}')">← ${esc(n)}</span>`;}),
      ...out.map(r=>{const n=typeof r==='string'?r:r.target_class;return `<span class="sb-ref" onclick="window.__openSb('${esc(n)}')">→ ${esc(n)}</span>`;}),
    ].join('');
    html+=`<div class="sb-sec"><div class="sb-sec-title">${esc(t('references'))}</div><div class="sb-refs">${links}</div></div>`;
  }
  sbFields.innerHTML=html;
  sidebar.classList.add('open');
}

function closeSidebar() {
  sidebar.classList.remove('open');
  document.querySelectorAll('.grp-node,.reg-node').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll('#canvas [data-cls].focus-exempt').forEach(el => el.classList.remove('focus-exempt'));
  selectedCls=null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
}

// Mobile: swipe down to close drawer
(function() {
  var startY = 0, currentY = 0, dragging = false;
  sidebar.addEventListener('touchstart', function(e) {
    if (!sidebar.classList.contains('open')) return;
    var t = e.touches[0];
    startY = t.clientY;
    currentY = startY;
    dragging = true;
    sidebar.style.transition = 'none';
  }, { passive: true });
  sidebar.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    currentY = e.touches[0].clientY;
    var dy = currentY - startY;
    if (dy > 0) {
      sidebar.style.transform = 'translateY(' + dy + 'px)';
    }
  }, { passive: true });
  sidebar.addEventListener('touchend', function() {
    if (!dragging) return;
    dragging = false;
    sidebar.style.transition = '';
    var dy = currentY - startY;
    if (dy > 80) {
      closeSidebar();

      sidebar.style.transform = '';
    }

function clearFocusExempt() {
