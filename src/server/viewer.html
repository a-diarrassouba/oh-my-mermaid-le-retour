// ── flowchart parser ──────────────────────────────────────
function parseFlowchart(raw) {
  const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('%%'));
  let rankdir = 'LR';
  const nodesMap = new Map(), edges = [], classOf = {};

  function cleanLabel(s) { return s.replace(/<br\s*\/?>/gi, '\n').replace(/\\n/g, '\n'); }
  function refFromLabel(label) {
    // Detect @class-name at start of label (e.g. "@channel-system" or "@auth-flow\nsome path")
    const m = label.match(/^@([\w-]+)/);
    return m ? m[1] : null;
  }
  function tok(t) {
    t = t.trim();
    let m;
    m = t.match(/^(@?[\w-]+)\["([^"]+)"\]$/); if (m) { const lbl=cleanLabel(m[2]),r=refFromLabel(lbl),idR=m[1].startsWith('@'); return {id:m[1].replace(/^@/,''),label:lbl,shape:'rect',isRef:idR||!!r,refTarget:r||(idR?m[1].replace(/^@/,''):null)}; }
    m = t.match(/^(@?[\w-]+)\[([^\]]+)\]$/);  if (m) { const lbl=cleanLabel(m[2]),r=refFromLabel(lbl),idR=m[1].startsWith('@'); return {id:m[1].replace(/^@/,''),label:lbl,shape:'rect',isRef:idR||!!r,refTarget:r||(idR?m[1].replace(/^@/,''):null)}; }
    m = t.match(/^(@?[\w-]+)\(\(([^)]+)\)\)$/); if (m) { const lbl=cleanLabel(m[2]),r=refFromLabel(lbl),idR=m[1].startsWith('@'); return {id:m[1].replace(/^@/,''),label:lbl,shape:'stadium',isRef:idR||!!r,refTarget:r||(idR?m[1].replace(/^@/,''):null)}; }
    m = t.match(/^(@?[\w-]+)\(([^)]+)\)$/);   if (m) { const lbl=cleanLabel(m[2]),r=refFromLabel(lbl),idR=m[1].startsWith('@'); return {id:m[1].replace(/^@/,''),label:lbl,shape:'round',isRef:idR||!!r,refTarget:r||(idR?m[1].replace(/^@/,''):null)}; }
    m = t.match(/^(@?[\w-]+)\{([^}]+)\}$/);   if (m) { const lbl=cleanLabel(m[2]),r=refFromLabel(lbl),idR=m[1].startsWith('@'); return {id:m[1].replace(/^@/,''),label:lbl,shape:'diamond',isRef:idR||!!r,refTarget:r||(idR?m[1].replace(/^@/,''):null)}; }
    if (/^@?[\w-]+$/.test(t)) { const id=t.replace(/^@/,''); return {id,label:id,shape:'rect',isRef:t.startsWith('@')}; }
    return null;
  }

  // Edge pattern: A --> B, A -->|label| B, A -- "label" --> B, etc.
  const edgeLineRe = /^(.+?)\s+--\s+"([^"]+)"\s+-->\s+(.+)$/;
  const arrowRe = /(-->(?:\|[^|]*\|)?|--o|--x|---|-.->|==>|~~>)/;
  for (const line of lines) {
    const dir = line.match(/^(?:graph|flowchart)\s+([A-Z]{2})/i);
    if (dir) { const d=dir[1].toUpperCase(); rankdir=(d==='TD'||d==='TB')?'TB':d; continue; }
    if (/^(classDef|click |style |linkStyle|subgraph|end$)/i.test(line)) continue;
    const ca = line.match(/^class\s+([\w\-,\s]+)\s+(\w+)$/);
    if (ca) { ca[1].split(',').map(s=>s.trim()).forEach(id=>classOf[id]=ca[2]); continue; }
    // Try "-- label -->" syntax first (e.g., APP -- "HTTP API" --> SERVER)
    const labelEdge = line.match(edgeLineRe);
    if (labelEdge) {
      const src=tok(labelEdge[1]), dst=tok(labelEdge[3]);
      if (src&&dst) {
        if (!nodesMap.has(src.id)) nodesMap.set(src.id,src);
        if (!nodesMap.has(dst.id)) nodesMap.set(dst.id,dst);
        edges.push({from:src.id,to:dst.id,label:labelEdge[2].replace(/<br\s*\/?>/gi,' ')});
      }
      continue;
    }
    const parts = line.split(arrowRe);
    if (parts.length >= 3) {
      const src=tok(parts[0]), dst=tok(parts[2]);
      if (src&&dst) {
        if (!nodesMap.has(src.id)) nodesMap.set(src.id,src);
        if (!nodesMap.has(dst.id)) nodesMap.set(dst.id,dst);
        const lm=parts[1].match(/\|([^|]+)\|/);
        // |"label"| keeps its quotes in Mermaid source; they are not part of the text.
        edges.push({from:src.id,to:dst.id,label:lm?lm[1].replace(/<br\s*\/?>/gi,' ').trim().replace(/^"(.*)"$/,'$1'):''});
      }
    } else {
      const n=tok(line); if (n&&!nodesMap.has(n.id)) nodesMap.set(n.id,n);
    }
  }
  for (const [id,cls] of Object.entries(classOf)) { const n=nodesMap.get(id); if (n) n.cls=cls; }
  return {rankdir, nodes:[...nodesMap.values()], edges};
}

// ── node style ────────────────────────────────────────────
function nodeStyle(node) {
  const c = node.cls||'';
  if (isDark) {
    if (c==='external') return {bg:'#0a0a0a',border:'#666666',dash:null,text:'#cccccc'};
    if (c==='lib')      return {bg:'#0a0a0a',border:'#666666',dash:null, text:'#cccccc'};
    return                    {bg:'#0a0a0a',border:'#666666',dash:null, text:'#ffffff'};
  } else {
    if (c==='external') return {bg:'#e0e0e0',border:'#bbb',dash:null,text:'#64748b'};
    if (c==='lib')      return {bg:'#e8e8e8',border:'#c0c0c0',dash:null, text:'#553388'};
    return                    {bg:'#f0f0f0',border:'#999',    dash:null, text:'#1a1a1a'};
  }
}

// ── smooth path through all Dagre waypoints ───────────────
// Uses quadratic bezier spline so edges respect Dagre's obstacle routing
function smoothPath(pts) {
  if (!pts || pts.length < 2) return '';
  if (pts.length === 2) {
    // Simple S-curve for two-point edges
    const [a, b] = pts;
    const mx = r1((a.x+b.x)/2), my = r1((a.y+b.y)/2);
    return `M${r1(a.x)},${r1(a.y)} C${mx},${r1(a.y)} ${mx},${r1(b.y)} ${r1(b.x)},${r1(b.y)}`;
  }
  // Quadratic bezier spline: smooth through all waypoints
  let d = `M${r1(pts[0].x)},${r1(pts[0].y)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const mid = { x: (pts[i].x + pts[i+1].x) / 2, y: (pts[i].y + pts[i+1].y) / 2 };
    d += ` Q${r1(pts[i].x)},${r1(pts[i].y)} ${r1(mid.x)},${r1(mid.y)}`;
  }
  const last = pts[pts.length-1];
  d += ` L${r1(last.x)},${r1(last.y)}`;
  return d;
}

// ── render one class group (recursive) ────────────────────
// _expandedGlobal prevents same class from expanding in multiple branches
let _expandedGlobal = new Set();

function renderGroup(cls, classesData, allClasses, level, seen = new Set(), scopedPath) {
  if (seen.has(cls)) return null;
  seen = new Set(seen); seen.add(cls);
  if (!scopedPath) scopedPath = cls; // level 0: scopedPath = perspective name
  let labelOverlay = ''; // centered labels for sub-groups, rendered outside grp-inner

  const data = classesData[cls];
  if (!data?.diagram) return null;

  const parsed = parseFlowchart(data.diagram);
  const {rankdir, nodes, edges} = parsed;
  if (!nodes.length) return null;

  // padding around the group content
  const PAD_L = 16, PAD_R = 20, PAD_T = 20, PAD_B = 16;

  // For level 0: expand @ref nodes as sub-groups
  const subGroups = {}; // nodeId -> { cls, W, H, svgContent }
  const nodeDims  = {}; // nodeId -> { width, height }

  // Determine children of current element for subgroup resolution
  const currentChildren = (level === 0 ? (childrenByPerspective[cls] || []) : (classesData[cls]?.children || []));

  for (const n of nodes) {
    // Resolve subgroup: @ref (legacy) OR node ID is a child of current element with its own diagram
    const refCls = n.isRef ? (n.refTarget || n.id) : (currentChildren.includes(n.id) && classesData[n.id]?.diagram ? n.id : null);
    if (level < maxDepth && refCls && classesData[refCls]?.diagram && !seen.has(refCls) && !_expandedGlobal.has(refCls)) {
      _expandedGlobal.add(refCls);
      const childScopedPath = scopedPath + '/' + refCls;
      const sub = renderGroup(refCls, classesData, allClasses, level+1, seen, childScopedPath);
      if (sub) {
        // Scale down to fit max box. At small scales, edge overflow becomes negligible.
        const MAX_W = 320, MAX_H = 220, PAD = 12;
        const fs = Math.min((MAX_W - PAD*2) / sub.W, (MAX_H - PAD*2) / sub.H, 1);
        subGroups[n.id] = { cls: refCls, scopedPath: childScopedPath, ...sub, fitScale: fs };
        nodeDims[n.id] = { width: sub.W * fs + PAD * 2, height: sub.H * fs + PAD * 2 };
      }
    }
    if (!nodeDims[n.id]) {
      const lbl = n.label.replace(/^@/,'');
      const [mainLbl] = lbl.split('\n');
      const hasPath = lbl.includes('\n');
      const maxW = nodes.length > 10 ? 160 : 220;
      const w = Math.min(maxW, Math.max(80, tw(mainLbl, '12px Inter,system-ui') + 44));
      const baseH = n.shape==='diamond' ? 42 : 38;
      nodeDims[n.id] = {width: w, height: hasPath ? baseH + 14 : baseH};
    }
  }

  // Pre-process: identify fan-out groups for compact grid layout
  const maxPerRow = 3;
  const _gridGroups = {};  // virtualId -> { parentId, children[], cols, cellW, cellH }
  const _gridExcluded = new Set();  // node IDs replaced by virtual nodes
  const _gridPositions = {};  // childId -> { x, y } (filled after dagre)

  for (const n of nodes) {
    const outEdges = edges.filter(e => e.from === n.id);
    const leafTargets = outEdges
      .map(e => e.to)
      .filter(tid => !edges.some(e2 => e2.from === tid) && !subGroups[tid]);
    if (leafTargets.length > maxPerRow) {
      const cols = maxPerRow;
      const rows = Math.ceil(leafTargets.length / cols);
      const maxCW = Math.max(...leafTargets.map(id => nodeDims[id].width));
      const maxCH = Math.max(...leafTargets.map(id => nodeDims[id].height));
      const cellW = maxCW + 16;
      const cellH = maxCH + 10;
      const vid = `__grid_${n.id}`;
      _gridGroups[vid] = { parentId: n.id, children: leafTargets, cols, cellW, cellH };
      nodeDims[vid] = { width: cols * cellW, height: rows * cellH };
      leafTargets.forEach(id => _gridExcluded.add(id));
    }
  }

  // Dagre layout with virtual grid nodes
  const dense = nodes.length > 10;
  function buildGraph(rd) {
    const g = new dagre.graphlib.Graph();
    const nsep = dense ? 20 : 32;
    const rsep = dense ? 28 : 44;
    g.setGraph({rankdir: rd, nodesep:nsep, ranksep:rsep, marginx:PAD_L, marginy:PAD_T});
    g.setDefaultEdgeLabel(() => ({}));
    for (const n of nodes) {
      if (!_gridExcluded.has(n.id)) g.setNode(n.id, nodeDims[n.id]);
    }
    for (const vid of Object.keys(_gridGroups)) g.setNode(vid, nodeDims[vid]);
    const _addedVirtEdges = new Set();
    for (const e of edges) {
      let from = e.from, to = e.to;
      if (_gridExcluded.has(from)) continue;
      if (_gridExcluded.has(to)) {
        const vEntry = Object.entries(_gridGroups).find(([,gr]) => gr.children.includes(to));
        if (!vEntry) continue;
        to = vEntry[0];
        const ek = `${from}->${to}`;
        if (_addedVirtEdges.has(ek)) continue;
        _addedVirtEdges.add(ek);
      }
      if (g.hasNode(from) && g.hasNode(to)) g.setEdge(from, to, {label: e.label});
    }
    try { dagre.layout(g); return g; } catch { return null; }
  }

  let g = buildGraph(rankdir);
  if (!g) return null;
  const gi0 = g.graph();
  const aspectThreshold = nodes.length > 12 ? 1.4 : nodes.length > 7 ? 1.6 : 2.0;
  if (gi0.width > 0 && gi0.height > 0 && gi0.width / gi0.height > aspectThreshold && rankdir !== 'TB') {
    const gTB = buildGraph('TB');
    if (gTB) g = gTB;
  }

  // Expand virtual grid nodes into child positions
  for (const [vid, group] of Object.entries(_gridGroups)) {
    const vNode = g.node(vid);
    if (!vNode) continue;
    const { children, cols, cellW, cellH } = group;
    const rows = Math.ceil(children.length / cols);
    const startX = vNode.x - ((cols - 1) * cellW) / 2;
    const startY = vNode.y - ((rows - 1) * cellH) / 2;
    children.forEach((childId, i) => {
      _gridPositions[childId] = {
        x: startX + (i % cols) * cellW,
        y: startY + Math.floor(i / cols) * cellH
      };
    });
  }

  const gi = g.graph();
  const W = r1(gi.width + PAD_R);
  const H = r1(gi.height + PAD_B);

  const uid = `${cls.replace(/[^a-z0-9]/gi,'')}_l${level}_`;
  const th = theme();
  let svg = '';
  // Edge labels go on top of the nodes, so a node never hides the end of a label.
  let edgeLabels = '';

  // edges
  edges.forEach((e,i) => {
    if (_gridExcluded.has(e.from)) return; // skip edges from grid children
    let pts, d, mid;
    const srcPos = g.node(e.from) || _gridPositions[e.from];
    const tgtPos = _gridPositions[e.to] || g.node(e.to);
    if (!srcPos || !tgtPos) return;
    if (_gridPositions[e.to]) {
      // Edge to grid child: direct path from parent to child grid position
      const mx = (srcPos.x + tgtPos.x) / 2, my = (srcPos.y + tgtPos.y) / 2;
      pts = [{x:srcPos.x,y:srcPos.y},{x:mx,y:my},{x:tgtPos.x,y:tgtPos.y}];
      d = smoothPath(pts);
      mid = {x:mx, y:my};
    } else {
      const ed = g.edge(e.from, e.to); if (!ed?.points?.length) return;
      pts = ed.points;
      d = smoothPath(pts);
      mid = pts[Math.floor(pts.length/2)];
    }
    const ec = th.edgeColor0;
    const mk = `${uid}m${i}`;
    const eid = `${uid}e${i}`;
    const ends = `data-edge="${eid}" data-from="${esc(e.from)}" data-to="${esc(e.to)}"`;
    svg += `<defs><marker id="${mk}" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L0,4.5 L6,2.5 z" fill="${ec}"/></marker></defs>
      <path class="edge-path" d="${d}" stroke="${ec}" stroke-width="2" fill="none" marker-end="url(#${mk})" ${ends}/>
      <path class="edge-flow" d="${d}" data-edge="${eid}"/>
      <path class="edge-hit" d="${d}" ${ends}/>`;
    if (e.label) {
      const lw = tw(e.label,'9px Inter')+10;
      const mx=r1(mid.x), my=r1(mid.y);
      edgeLabels += `<g class="edge-label" data-edge="${eid}"><rect x="${r1(mx-lw/2)}" y="${my-7}" width="${lw}" height="14" rx="3" fill="${th.edgeLabelBg}"/>
        <text x="${mx}" y="${my+3}" text-anchor="middle" font-family="Inter,system-ui" font-size="9" fill="${th.edgeLabelText}">${esc(e.label)}</text></g>`;
    }
  });

  // nodes
  for (const n of nodes) {
    const pos = _gridPositions[n.id] || g.node(n.id); if (!pos) continue;
    const dim = nodeDims[n.id];
    const nx = r1(pos.x - dim.width/2);
    const ny = r1(pos.y - dim.height/2);
    const sg = subGroups[n.id];

    if (sg) {
      // ── sub-group: dashed boundary + nested content ──
      const safeId = esc(sg.cls); // short name for display
      const scopedId = esc(sg.scopedPath || sg.cls); // full path for selection
      const refSubStroke = th.subStroke;
      const fs = sg.fitScale;
      const PAD = 12;
      const boxW = sg.W * fs + PAD * 2, boxH = sg.H * fs + PAD * 2;
      const clipId = `${uid}clip_${n.id}`;
      svg += `<defs><clipPath id="${clipId}"><rect x="-2" y="-16" width="${r1(boxW+4)}" height="${r1(boxH+18)}" rx="6"/></clipPath></defs>`;
      svg += `<g class="grp-node" clip-path="url(#${clipId})" onclick="event.stopPropagation();window.__openSb('${scopedId}')" data-cls="${scopedId}" data-depth="${level+1}" transform="translate(${nx},${ny})">`;
      svg += `<rect class="grp-border" width="${r1(boxW)}" height="${r1(boxH)}" rx="5"
        fill="${th.subFill}" stroke="${refSubStroke}" stroke-width="2"/>`;
      const _slW = tw(displayTitle(sg.scopedPath || sg.cls), '600 9px "Plus Jakarta Sans",Inter,system-ui') + 12;
      svg += `<rect class="grp-label-top grp-label-bg" x="5" y="-7" width="${_slW}" height="14" rx="2" fill="${th.subFill}" opacity="1"/>`;
      svg += `<text class="grp-label-top" x="10" y="2" font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="9" font-weight="600"
        fill="${th.subLabelFill}" letter-spacing="0.05em">${esc(displayTitle(sg.scopedPath || sg.cls))}</text>`;
      svg += `<g class="grp-inner" transform="translate(${r1(PAD)},${r1(PAD)}) scale(${r1(fs)})">${sg.svgContent}</g>`;
      svg += `<text class="grp-label-center" data-maxw="${r1(boxW)}" x="${r1(boxW/2)}" y="${r1(boxH/2)}" text-anchor="middle" dominant-baseline="central"
        font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="9" font-weight="600" fill="${th.grpLabelCenterFill}" letter-spacing="0.05em">${esc(displayTitle(sg.scopedPath || sg.cls))}</text>`;
      svg += `</g>`;
      labelOverlay += `<text class="grp-label-center" data-maxw="${r1(boxW)}" x="${r1(nx + boxW/2)}" y="${r1(ny + boxH/2)}" text-anchor="middle" dominant-baseline="central"
        font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="9" font-weight="600" fill="${th.grpLabelCenterFill}" letter-spacing="0.05em">${esc(displayTitle(sg.scopedPath || sg.cls))}</text>`;
    } else {
      // ── regular node ──
      const st = nodeStyle(n);
      if (n.label.startsWith('@')) {
        // @ref nodes keep same border as default (white)
        // @ref nodes keep solid border
      }
      const da = st.dash ? `stroke-dasharray="${st.dash}"` : '';
      const rawLbl = n.label.replace(/^@/,'');
      const [mainLbl, pathLbl] = rawLbl.split('\n');
      const cx = r1(pos.x), cy = r1(pos.y);
      const fs = 12;
      const nodeScopedId = esc(scopedPath + '/' + n.id);
      let shape = '';
      if (n.shape==='diamond') {
        shape = `<polygon class="nshape" points="${cx},${ny} ${nx+dim.width},${cy} ${cx},${ny+dim.height} ${nx},${cy}"
          fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
      } else if (n.shape==='stadium'||n.shape==='round') {
        shape = `<rect class="nshape" x="${nx}" y="${ny}" width="${dim.width}" height="${dim.height}"
          rx="${dim.height/2}" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
      } else {
        shape = `<rect class="nshape" x="${nx}" y="${ny}" width="${dim.width}" height="${dim.height}"
          rx="4" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
      }
      if (pathLbl) {
        svg += `<g class="reg-node" data-cls="${nodeScopedId}" onclick="event.stopPropagation();window.__openSb('${nodeScopedId}')">${shape}
          <text class="node-lbl" x="${cx}" y="${r1(cy - 7)}" text-anchor="middle" dominant-baseline="central"
            font-family="Inter,system-ui,sans-serif" font-size="${fs}" fill="${st.text}">${esc(mainLbl)}</text>
          <text class="node-path" x="${cx}" y="${r1(cy + 7)}" text-anchor="middle" dominant-baseline="central"
            font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="${st.text}" opacity="0.45">${esc(pathLbl)}</text>
        </g>`;
      } else {
        svg += `<g class="reg-node" data-cls="${nodeScopedId}" onclick="event.stopPropagation();window.__openSb('${nodeScopedId}')">${shape}
          <text class="node-lbl" x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
            font-family="Inter,system-ui,sans-serif" font-size="${fs}" fill="${st.text}">${esc(mainLbl)}</text>
        </g>`;
      }
    }
  }

  return { svgContent: svg + edgeLabels, W, H, labelOverlay };
}

// ── sidebar diagram renderer (flat, for sidebar only) ─────
function renderFlatSVG(text) {
  if (!text) return null;
  let parsed; try { parsed = parseFlowchart(text); } catch { return null; }
  const {rankdir, nodes, edges} = parsed;
  if (!nodes.length) return null;
  const g = new dagre.graphlib.Graph();
  g.setGraph({rankdir, nodesep:36, ranksep:48, marginx:18, marginy:14});
  g.setDefaultEdgeLabel(() => ({}));
  const dims = {};
  for (const n of nodes) {
    const lbl = n.label.replace(/^@/,'');
    const [mainLbl] = lbl.split('\n');
    const hasPath = lbl.includes('\n');
    const w = Math.min(180,Math.max(60,tw(mainLbl,'11px Inter,system-ui')+28));
    const h = (n.shape==='diamond'?34:28) + (hasPath ? 12 : 0);
    dims[n.id]={w,h}; g.setNode(n.id,{width:w,height:h});
  }
  for (const e of edges) { if (g.hasNode(e.from)&&g.hasNode(e.to)) g.setEdge(e.from,e.to,{label:e.label}); }
  try { dagre.layout(g); } catch { return null; }
  const gi = g.graph();
  const W = r1((gi.width||150)+36), H = r1((gi.height||80)+28);
  let edg='', nds='';
  const sth = theme();
  edges.forEach((e,i) => {
    const ed=g.edge(e.from,e.to); if (!ed?.points?.length) return;
    const pts=ed.points, d=smoothPath(pts);
    const mid=pts[Math.floor(pts.length/2)];
    const mk=`sbm${i}${Math.random().toString(36).slice(2,5)}`;
    edg+=`<defs><marker id="${mk}" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0.5 L0,4.5 L6,2.5 z" fill="${sth.edgeColor0}"/></marker></defs>
      <path class="edge-path" d="${d}" stroke="${sth.edgeColor0}" stroke-width="2" fill="none" marker-end="url(#${mk})" data-from="${esc(e.from)}" data-to="${esc(e.to)}"/>`;
    if (e.label) {
      const lw=tw(e.label,'9px Inter')+8, mx=r1(mid.x), my=r1(mid.y);
      edg+=`<rect x="${mx-lw/2}" y="${my-6}" width="${lw}" height="12" rx="2" fill="${sth.edgeLabelBg}"/>
        <text x="${mx}" y="${my+3}" text-anchor="middle" font-family="Inter,system-ui" font-size="9" fill="${sth.edgeLabelText}">${esc(e.label)}</text>`;
    }
  });
  for (const n of nodes) {
    const pos=g.node(n.id); if (!pos) continue;
    const {w,h}=dims[n.id];
    const nx=r1(pos.x-w/2), ny=r1(pos.y-h/2), cx=r1(pos.x), cy=r1(pos.y);
    const st=nodeStyle(n), da=st.dash?`stroke-dasharray="${st.dash}"`:'';
    const rawLbl=n.label.replace(/^@/,'');
    const [mainLbl, pathLbl]=rawLbl.split('\n');
    let shape='';
    if (n.shape==='diamond') shape=`<polygon points="${cx},${ny} ${nx+w},${cy} ${cx},${ny+h} ${nx},${cy}" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
    else if (n.shape==='stadium'||n.shape==='round') shape=`<rect x="${nx}" y="${ny}" width="${w}" height="${h}" rx="${h/2}" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
    else shape=`<rect x="${nx}" y="${ny}" width="${w}" height="${h}" rx="4" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${da}/>`;
    if (pathLbl) {
      nds+=`<g>${shape}
        <text x="${cx}" y="${r1(cy-6)}" text-anchor="middle" dominant-baseline="central"
          font-family="Inter,system-ui" font-size="11" fill="${st.text}">${esc(mainLbl)}</text>
        <text x="${cx}" y="${r1(cy+6)}" text-anchor="middle" dominant-baseline="central"
          font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="${st.text}" opacity="0.45">${esc(pathLbl)}</text>
      </g>`;
    } else {
      nds+=`<g>${shape}<text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central"
        font-family="Inter,system-ui" font-size="11" fill="${st.text}">${esc(mainLbl)}</text></g>`;
    }
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible" xmlns="http://www.w3.org/2000/svg">${edg}${nds}</svg>`;
}

// ── canvas pan/zoom ───────────────────────────────────────
const canvasWrap = document.getElementById('canvas-wrap');
const canvasEl   = document.getElementById('canvas');
const sidebar    = document.getElementById('sidebar');
const sbTitle    = document.getElementById('sb-title');
const sbDiagram  = document.getElementById('sb-diagram');
const sbFields   = document.getElementById('sb-fields');
const zoomLabel  = document.getElementById('zoom-label');
const navTitle   = document.getElementById('nav-title');
const navList    = document.getElementById('nav-list');

let vpX=0, vpY=0, vpScale=0.7;
let classes=[], classesData={}, refsData={};
let selectedCls=null, svgW=0, svgH=0;
const maxDepth = 6;  // always render all depths; visibility controlled per-group by CSS

const api = p => fetch(p).then(r=>r.json()).catch(()=>({}));

// ── transform ──────────────────────────────────────────────
const MIN_SCALE = 0.02, MAX_SCALE = 30;

function applyTransform() {
  canvasEl.style.transform=`translate(${vpX}px,${vpY}px) scale(${vpScale})`;
  const pct = Math.round(vpScale*100);
  zoomLabel.textContent = pct >= 1000 ? `${(pct/100).toFixed(0)}k%` : `${pct}%`;

  // Scale-compensated group labels: keep ~13px rendered size
  const targetPx = 13;
  const fs = Math.min(72, Math.max(10, targetPx / vpScale));
  const fsStr = (Math.round(fs * 10) / 10).toString();
  const labelFill = isDark ? (vpScale < 0.5 ? '#ccc' : '#cbd5e1') : (vpScale < 0.5 ? '#333' : '#475569');
  document.querySelectorAll('#canvas .grp-label-top').forEach(el => {
    if (el.tagName === 'text') {
      el.setAttribute('font-size', fsStr);
      el.setAttribute('fill', labelFill);
    } else if (el.classList.contains('grp-label-bg')) {
      // Scale background rect height to match font-size
      el.setAttribute('height', String(Math.round(fs * 1.5)));
    }
  });
  // Center label: keep ~20px rendered size in overview
  const fsCtr = Math.min(120, Math.max(14, 20 / vpScale));
  const fsCtrStr = (Math.round(fsCtr * 10) / 10).toString();
  document.querySelectorAll('#canvas .grp-label-center').forEach(el => {
    el.setAttribute('font-size', fsCtrStr);
  });
  // Scale-compensated node labels: keep ~11px rendered size at any zoom level
  const fsNode = Math.min(60, Math.max(11, 11 / vpScale));
  const fsNodeStr = (Math.round(fsNode * 10) / 10).toString();
  document.querySelectorAll('#canvas .node-lbl').forEach(el => {
    el.setAttribute('font-size', fsNodeStr);
  });

  canvasWrap.classList.toggle('zoom-overview', vpScale < 0.42);
  // A centered group title never gets wider than its box (translated titles are long).
  document.querySelectorAll('#canvas .grp-label-center[data-maxw]').forEach(el => {
    const len = el.getComputedTextLength();
    const max = parseFloat(el.dataset.maxw) * 0.9;
    if (len > max) el.setAttribute('font-size', String(Math.round(parseFloat(el.getAttribute('font-size')) * max / len * 10) / 10));
  });

  // Viewport-relative expansion: measure group's own border rect
  const vpW = canvasWrap.clientWidth;
  document.querySelectorAll('#canvas [data-depth]').forEach(el => {
    const border = el.querySelector(':scope > .grp-border');
    if (!border) return;
    const rect = border.getBoundingClientRect();
    const depth = parseInt(el.getAttribute('data-depth') || '0', 10);

    // Collapse: hide inner content when group is too small on screen (progressive reveal)
    const collapseThreshold = vpW * 0.275;  // 27.5% of canvas viewport width
    const collapsed = rect.width < collapseThreshold;
    el.classList.toggle('grp-collapsed', collapsed);

    // Expansion: label switching (existing logic)
    // Root=50%, depth1=65%, depth2=80% of viewport width to expand
    const threshold = 0.5 + depth * 0.15;
    const expanded = rect.width >= vpW * threshold;
    el.classList.toggle('grp-expanded', expanded);
  });

}

function zoomTo(newScale, originX, originY) {
  const s = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
  const cW = canvasWrap.clientWidth, cH = canvasWrap.clientHeight;
  const cx = originX ?? cW/2, cy = originY ?? cH/2;
  vpX = cx - (cx - vpX) * (s / vpScale);
  vpY = cy - (cy - vpY) * (s / vpScale);
  vpScale = s;
  applyTransform();
}

function centerView() {
  if (!svgW) return;
  const cW=canvasWrap.clientWidth, cH=canvasWrap.clientHeight;
  const s = Math.min(0.9, (cW-80)/svgW, (cH-80)/svgH);
  vpScale = s;
  vpX = cW/2 - (svgW/2)*s;
  vpY = cH/2 - (svgH/2)*s;
  applyTransform();
}

window.zoomIn    = () => zoomTo(vpScale * 1.25);
window.zoomOut   = () => zoomTo(vpScale / 1.25);
window.resetView = centerView;

// ── animated transition ────────────────────────────────────
let _raf = null;
function animateTo(toX, toY, toScale, duration=380) {
  if (_raf) cancelAnimationFrame(_raf);
  const fromX = vpX, fromY = vpY, fromS = vpScale;
  const t0 = performance.now();
  function frame(now) {
    const t = Math.min(1, (now - t0) / duration);
    const e = 1 - Math.pow(1 - t, 3); // ease-out cubic
    vpX = fromX + (toX - fromX) * e;
    vpY = fromY + (toY - fromY) * e;
    vpScale = fromS + (toScale - fromS) * e;
    applyTransform();
    if (t < 1) _raf = requestAnimationFrame(frame);
  }
  _raf = requestAnimationFrame(frame);
}

function focusGroup(cls) {
  // Mark focused group as exempt from blur
  document.querySelectorAll('#canvas [data-cls].focus-exempt').forEach(el => el.classList.remove('focus-exempt'));
  const el = document.querySelector(`#canvas [data-cls="${CSS.escape(cls)}"]`);
  if (!el) return;
  el.classList.add('focus-exempt');
  // Also exempt all ancestor groups so parent blur doesn't hide focused child
  let ancestor = el.parentElement;
  while (ancestor) {
    if (ancestor.hasAttribute && ancestor.hasAttribute('data-cls')) {
      ancestor.classList.add('focus-exempt');
    }
    ancestor = ancestor.parentElement;
  }

  // Use the group's border rect for accurate dimensions
  const border = el.querySelector(':scope > .grp-border') || el;
  const rect = border.getBoundingClientRect();
  const wrapRect = canvasWrap.getBoundingClientRect();

  // Convert screen coords to SVG space
  const svgCenterX = (rect.left + rect.width/2 - wrapRect.left - vpX) / vpScale;
  const svgCenterY = (rect.top + rect.height/2 - wrapRect.top - vpY) / vpScale;
  const svgW = rect.width / vpScale;
  const svgH = rect.height / vpScale;

  // Available viewport (account for sidebar: right panel on desktop, bottom drawer on mobile)
  const isMobile = window.innerWidth <= 768;
  const sbW = (!isMobile && sidebar.classList.contains('open')) ? 400 : 0;
  const sbH = (isMobile && sidebar.classList.contains('open')) ? window.innerHeight * 0.5 : 0;
  const availW = canvasWrap.clientWidth - sbW - 60;
  const availH = canvasWrap.clientHeight - sbH - 60;

  // Target scale to fit element with padding
  const targetScale = Math.min(MAX_SCALE, Math.max(0.15, Math.min(availW / svgW, availH / svgH) * 0.85));

  // Center in available viewport (account for sidebar/drawer)
  const centerX = (canvasWrap.clientWidth - sbW) / 2;
  const centerY = (canvasWrap.clientHeight - sbH) / 2;
  const toX = centerX - svgCenterX * targetScale;
  const toY = centerY - svgCenterY * targetScale;

  animateTo(toX, toY, targetScale);
}

// ── wheel: Figma-style ─────────────────────────────────────
// trackpad two-finger scroll → pan
// trackpad pinch (ctrlKey) / Ctrl+mousewheel → zoom
canvasWrap.addEventListener('wheel', e => {
  e.preventDefault();
  clearFocusExempt();

  if (e.ctrlKey || e.metaKey) {
    // Zoom — trackpad pinch gives pixel deltas, mouse wheel gives line deltas
    let factor;
    if (e.deltaMode === 0) {
      // trackpad pinch: more responsive
      factor = Math.pow(0.993, e.deltaY);
    } else {
      // mouse wheel: snappier step
      factor = e.deltaY < 0 ? 1.22 : 1/1.22;
    }
    zoomTo(vpScale * factor, e.clientX, e.clientY);
  } else {
    // Pan — respect both axes (trackpad two-finger swipe)
    vpX -= e.deltaX;
    vpY -= e.deltaY;
    applyTransform();
  }
}, { passive: false });

// ── pan: space+drag, middle-mouse, empty-area drag ─────────
let spaceHeld = false;
let panning = false, panA = {}, panV = {};

function updateCursor() {
  if (panning)      canvasWrap.style.cursor = 'grabbing';
  else if (spaceHeld) canvasWrap.style.cursor = 'grab';
  else              canvasWrap.style.cursor = '';
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' && document.activeElement === document.body) {
    e.preventDefault();
    spaceHeld = true;
    updateCursor();
  }
  // Figma keyboard shortcuts
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey) {
    if (e.key === '0') { e.preventDefault(); centerView(); }
    if (e.key === '1') { e.preventDefault(); zoomTo(1); }
    if (e.key === '2') { e.preventDefault(); zoomTo(2); }
    if (e.key === '+' || e.key === '=') { e.preventDefault(); window.zoomIn(); }
    if (e.key === '-') { e.preventDefault(); window.zoomOut(); }
  }
  if (e.target.closest?.('input, textarea')) return;
  if (e.key === 'Escape') { if (activeGuide) exitGuide(); closeSidebar(); }
  if (activeGuide && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (e.key === 'ArrowRight') { e.preventDefault(); nextGuideStep(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); goToGuideStep(guideStep - 1); }
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space') { spaceHeld = false; updateCursor(); }
});

canvasWrap.addEventListener('mousedown', e => {
  const isMiddle   = e.button === 1;
  const isSpaceDrag = e.button === 0 && spaceHeld;
  const isEmptyDrag = e.button === 0 && !spaceHeld &&
    !e.target.closest('.grp-node') && !e.target.closest('.reg-node') &&
    !e.target.closest('.float-controls') && !e.target.closest('#ask-bar') && !e.target.closest('#ask-panel');

  if (isMiddle || isSpaceDrag || isEmptyDrag) {
    e.preventDefault();
    panning = true;
    panA = { x: e.clientX, y: e.clientY };
    panV = { x: vpX, y: vpY };
    updateCursor();
  }
});

window.addEventListener('mousemove', e => {
  if (!panning) return;
  vpX = panV.x + (e.clientX - panA.x);
  vpY = panV.y + (e.clientY - panA.y);
  applyTransform();
});

window.addEventListener('mouseup', () => {
  if (panning) { panning = false; updateCursor(); }
});

// Touch: pan + pinch zoom
(function() {
  var touchStart = null, touchDist = null, touchScale = null;
  canvasWrap.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, vpX: vpX, vpY: vpY };
    } else if (e.touches.length === 2) {
      touchStart = null;
      var dx = e.touches[1].clientX - e.touches[0].clientX;
      var dy = e.touches[1].clientY - e.touches[0].clientY;
      touchDist = Math.hypot(dx, dy);
      touchScale = vpScale;
    }
  }, { passive: true });
  canvasWrap.addEventListener('touchmove', function(e) {
    if (e.touches.length === 1 && touchStart) {
      e.preventDefault();
      vpX = touchStart.vpX + (e.touches[0].clientX - touchStart.x);
      vpY = touchStart.vpY + (e.touches[0].clientY - touchStart.y);
      applyTransform();
    } else if (e.touches.length === 2 && touchDist) {
      e.preventDefault();
      var dx = e.touches[1].clientX - e.touches[0].clientX;
      var dy = e.touches[1].clientY - e.touches[0].clientY;
      var newDist = Math.hypot(dx, dy);
      var scale = touchScale * (newDist / touchDist);
      vpScale = Math.min(10, Math.max(0.05, scale));
      applyTransform();
    }
  }, { passive: false });
  canvasWrap.addEventListener('touchend', function() {
    touchStart = null; touchDist = null; touchScale = null;
  });
})();

// close sidebar when clicking empty canvas area
canvasWrap.addEventListener('click', e => {
  if (!e.target.closest('[onclick]')) closeSidebar();
});

// ── sidebar ───────────────────────────────────────────────
window.__openSb = function(cls, frameCls) {
  // Resolve: try full scoped path, then short name, then fallback to parent perspective
  var shortName = cls.includes('/') ? cls.split('/').pop() : cls;
  var dataKey = classesData[cls] ? cls : (classesData[shortName] ? shortName : null);
  if (!dataKey && cls.includes('/')) {
    // Fallback: show parent perspective for nodes without their own element data
    dataKey = cls.split('/')[0];
  }
  if (!dataKey || !classesData[dataKey]) return;
  // highlight using scoped cls for DOM, dataKey for data
  document.querySelectorAll('.grp-node,.reg-node').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll(`[data-cls="${CSS.escape(cls)}"]`).forEach(el=>el.classList.add('selected'));
  selectedCls=cls;
  const onStep = !!(activeGuide && cls === activeGuide.guide.steps[guideStep].element);
  sbStep.hidden = !onStep;
  // The step's file belongs to the step: hide it on another element, bring it back on the step.
  if (!onStep) setFilePanel(false);
  else if (activeGuide.guide.steps[guideStep].file && filePanel.hidden && filePanel.innerHTML) setFilePanel(true);
  // Coming back to the step's element opens on its explanation.
  if (onStep) sidebar.classList.remove('show-full');
  setGuidePanel(onStep);
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-nav') === cls);
  });
  var sidebarAlreadyOpen = sidebar.classList.contains('open');
  openSidebar(dataKey);
  if (sidebarAlreadyOpen) {
    focusGroup(frameCls || cls);
  } else {
    setTimeout(() => focusGroup(frameCls || cls), 260);
  }
  // Cloud mode: notify parent frame of selection
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'class-selected', className: cls }, '*');
  }
};

let sbOpenKey = null;
let threatModel = null;
function explainSection(data, md) {
  const ex = data.explain;
  if (!ex || !ex.novice) return '';
  const tabs = LEVELS.map(l => `<button type="button" class="sb-level${l === readerLevel ? ' on' : ''}" data-level="${l}">${esc(t('level' + l[0].toUpperCase() + l.slice(1)))}</button>`).join('');
  let body;
  if (readerLevel === 'novice') {
    body = md(ex.novice) + (ex.deeper ? `<details class="sb-deeper"><summary>${esc(t('deeper'))}</summary>${md(ex.deeper)}</details>` : '');
  } else if (readerLevel === 'junior') {
    body = md(ex.junior || data.description);
  } else {
    body = md(data.description);
  }
  return `<div class="sb-sec"><div class="sb-levels" role="group" aria-label="${esc(t('levelsAria'))}">${tabs}</div><div class="sb-sec-body">${body}</div></div>`;
}

function openSidebar(cls) {
  const data=classesData[cls]||{}, refs=refsData[cls]||{};
  sbOpenKey = cls;
  const glyph = iconOf(cls);
  sbTitle.innerHTML = (glyph ? `<span class="sb-icon" aria-hidden="true">${glyph}</span>` : '') + esc(displayTitle(cls));
  sbDiagram.innerHTML = '';
  // Fields come from .prisme/, written by AI: never let them run code.
  const md=t=>t?safeMarkdown(t):'';
  const sec=(title,body,ex='')=>body?`<div class="sb-sec ${ex}"><div class="sb-sec-title">${title}</div><div class="sb-sec-body">${body}</div></div>`:'';
  let html='';
  if (data.meta) {
    const when=data.meta.updated?new Date(data.meta.updated).toLocaleString(document.documentElement.lang):'';
    const n=data.meta.update_count||0;
    const updates=t(n===1?'updatesOne':'updatesOther',{n});
    html+=`<div class="sb-sec"><div class="sb-sec-title">${esc(t('meta'))}</div><div class="sb-meta-text">${when?esc(when)+'<br>':''}${esc(updates)}${data.meta.git_branch?` · ${esc(data.meta.git_branch)}`:''}${data.meta.git_commit?` · ${esc(data.meta.git_commit)}`:''}</div></div>`;
  }
  const explained = explainSection(data, md);
  html += explained || sec(esc(t('description')),md(data.description));
  // Threats on this element, from the threat model of /prisme-security.
  const elThreats = (threatModel && threatModel.threats || []).filter(th => th.element === cls);
  if (elThreats.length) html += sec(esc(t('threats')), elThreats.map(th => `<div class="sb-threat"><span class="sec-chip th-st-${esc(th.status)}">${esc(t('thStatus_' + th.status))}</span> <b>${esc(th.title)}</b><br>${strideChips(th.stride)}</div>`).join(''));
  html+=sec(esc(t('constraint')),md(data.constraint));
  html+=sec(esc(t('concern')),md(data.concern),'sb-concern');
  html+=sec(esc(t('context')),md(data.context));
  html+=sec(esc(t('todo')),md(data.todo));
  html+=sec(esc(t('note')),md(data.note));
  const inc=refs.incoming||[], out=refs.outgoing||[];
  if (inc.length||out.length) {
    const links=[
      ...inc.map(r=>{const n=typeof r==='string'?r:r.source_class;return `<span class="sb-ref" onclick="window.__openSb('${esc(n)}')">← ${esc(n)}</span>`;}),
      ...out.map(r=>{const n=typeof r==='string'?r:r.target_class;return `<span class="sb-ref" onclick="window.__openSb('${esc(n)}')">→ ${esc(n)}</span>`;}),
    ].join('');
    html+=`<div class="sb-sec"><div class="sb-sec-title">${esc(t('references'))}</div><div class="sb-refs">${links}</div></div>`;
  }
  sbFields.innerHTML=html;
  sidebar.classList.add('open');
}

function closeSidebar() {
  sidebar.classList.remove('open');
  document.querySelectorAll('.grp-node,.reg-node').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll('#canvas [data-cls].focus-exempt').forEach(el => el.classList.remove('focus-exempt'));
  selectedCls=null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
}

// Mobile: swipe down to close drawer
(function() {
  var startY = 0, currentY = 0, dragging = false;
  sidebar.addEventListener('touchstart', function(e) {
    if (!sidebar.classList.contains('open')) return;
    var t = e.touches[0];
    startY = t.clientY;
    currentY = startY;
    dragging = true;
    sidebar.style.transition = 'none';
  }, { passive: true });
  sidebar.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    currentY = e.touches[0].clientY;
    var dy = currentY - startY;
    if (dy > 0) {
      sidebar.style.transform = 'translateY(' + dy + 'px)';
    }
  }, { passive: true });
  sidebar.addEventListener('touchend', function() {
    if (!dragging) return;
    dragging = false;
    sidebar.style.transition = '';
    var dy = currentY - startY;
    if (dy > 80) {
      closeSidebar();
    } else {
      sidebar.style.transform = '';
    }
  });
})();
function clearFocusExempt() {
  document.querySelectorAll('#canvas [data-cls].focus-exempt').forEach(el => el.classList.remove('focus-exempt'));
}
window.closeSidebar=closeSidebar;
sbFields.addEventListener('click', e => {
  const level = e.target.closest('[data-level]');
  if (level) setReaderLevel(level.dataset.level);
});

// ── build full canvas SVG ─────────────────────────────────
function buildCanvas(classes, classesData, refsData) {
  _expandedGlobal = new Set(); // reset per render
  // Find top-level classes: those with no incoming @refs from other classes
  // Build outgoing ref counts to handle circular references
  const outCount = {}; // cls -> number of outgoing @refs to other classes
  const inCount = {};  // cls -> number of incoming @refs from other classes
  for (const cls of classes) { outCount[cls] = 0; inCount[cls] = 0; }
  for (const cls of classes) {
    const diagram = classesData[cls]?.diagram || '';
    const refs = [...new Set([...diagram.matchAll(/@([\w-]+)/g)].map(m=>m[1]).filter(r => classes.includes(r)))];
    outCount[cls] = refs.length;
    refs.forEach(r => { inCount[r]++; });
  }
  // Top-level = not referenced, OR referenced but has more outgoing refs than any referrer (cycle breaker)
  let topLevel = classes.filter(c => inCount[c] === 0);
  if (!topLevel.length) {
    // All classes have incoming refs (circular). Pick the one with most outgoing refs as root.
    const maxOut = Math.max(...classes.map(c => outCount[c]));
    topLevel = classes.filter(c => outCount[c] === maxOut);
  }
  const roots = topLevel;

  // Render each top-level group
  const groups = [];
  for (const cls of roots) {
    const g = renderGroup(cls, classesData, classes, 0);
    if (g) groups.push({ cls, ...g });
  }
  if (!groups.length) return null;

  // Grid layout — ceil(sqrt(N)) columns for balanced aspect ratio
  const COLS = Math.max(1, Math.ceil(Math.sqrt(groups.length)));
  const GAP_X = 70, GAP_Y = 90, OUTER_PAD = 60;

  // Assign grid positions
  groups.forEach((g, i) => { g._col = i % COLS; g._row = Math.floor(i / COLS); });
  const numRows = Math.ceil(groups.length / COLS);

  // Column widths = max group width in that column
  const colW = Array.from({length: COLS}, (_, c) =>
    Math.max(...groups.filter(g => g._col === c).map(g => g.W)));
  // Row heights = max group height in that row
  const rowH = Array.from({length: numRows}, (_, r) =>
    Math.max(...groups.filter(g => g._row === r).map(g => g.H)));

  // Compute offsets
  const colX = colW.reduce((acc, w, i) => { acc.push(i===0 ? 0 : acc[i-1]+colW[i-1]+GAP_X); return acc; }, []);
  const rowY = rowH.reduce((acc, h, i) => { acc.push(i===0 ? 0 : acc[i-1]+rowH[i-1]+GAP_Y); return acc; }, []);

  const totalW = colX[COLS-1] + colW[COLS-1];
  const totalH = rowY[numRows-1] + rowH[numRows-1];
  const canvasW = r1(totalW + OUTER_PAD*2);
  const canvasH = r1(totalH + OUTER_PAD*2);

  const th = theme();
  let innerSVG = '';
  for (const g of groups) {
    const tx = r1(OUTER_PAD + colX[g._col]);
    const ty = r1(OUTER_PAD + rowY[g._row]);
    const flow = FLOW_PERSPECTIVES.has(g.cls) ? ' flow-persp' : '';
    innerSVG += `<g class="grp-node${flow}" data-cls="${esc(g.cls)}" data-depth="0" transform="translate(${tx},${ty})" onclick="event.stopPropagation();window.__openSb('${esc(g.cls)}')">`;
    innerSVG += `<rect class="grp-border" width="${g.W}" height="${g.H}" rx="8"
      fill="${th.groupFill}" stroke="${th.groupStroke}" stroke-width="2"/>`;
    const _lblW = tw(displayTitle(g.cls), '600 10px "Plus Jakarta Sans",Inter,system-ui') + 14;
    innerSVG += `<rect class="grp-label-top grp-label-bg" x="6" y="-10" width="${_lblW}" height="20" rx="2" fill="${th.groupFill}" opacity="1"/>`;
    innerSVG += `<text class="grp-label-top" x="12" y="3" font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="10" font-weight="600"
      fill="${th.grpLabelFill}" letter-spacing="0.05em">${esc(displayTitle(g.cls))}</text>`;
    innerSVG += `<g class="grp-inner">${g.svgContent}</g>`;
    if (g.labelOverlay) innerSVG += `<g class="grp-sub-labels">${g.labelOverlay}</g>`;
    innerSVG += `<text class="grp-label-center" data-maxw="${r1(g.W)}" x="${r1(g.W/2)}" y="${r1(g.H/2)}" text-anchor="middle" dominant-baseline="central"
      font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="10" font-weight="600" fill="${th.grpLabelCenterFill}" letter-spacing="0.05em">${esc(displayTitle(g.cls))}</text>`;
    innerSVG += `</g>`;
  }

  return { html: `<svg width="${canvasW}" height="${canvasH}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">${innerSVG}</svg>`, W: canvasW, H: canvasH };
}

// ── post-render: glow filter + edge hover delegation ──────
let _hoverListenerAttached = false;
function postRender() {
  // Insert glow filter into the first SVG's <defs> in #canvas
  const svg = canvasEl.querySelector('svg');
  if (svg) {
    let defs = svg.querySelector('defs');
    if (!defs) { defs = document.createElementNS('http://www.w3.org/2000/svg','defs'); svg.prepend(defs); }
    // Remove existing glow filter if present (from prior render)
    const existing = defs.querySelector('#glow');
    if (existing) existing.remove();
    defs.insertAdjacentHTML('beforeend',
      '<filter id="glow"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>' +
      '<feFlood flood-color="#818cf8" flood-opacity="0.4" result="color"/>' +
      '<feComposite in="color" in2="blur" operator="in" result="shadow"/>' +
      '<feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
    );
  }

  // Attach edge-hover event delegation once (survives innerHTML replacements on canvasEl)
  if (!_hoverListenerAttached) {
    _hoverListenerAttached = true;
    canvasWrap.addEventListener('mouseover', e => {
      // Hovering an edge shows its label and its flow.
      const hit = e.target.closest('.edge-hit');
      if (hit) return showEdge(hit.dataset.edge);
      const node = e.target.closest('.reg-node, .grp-node');
      if (!node) return;
      // data-cls is the scoped path; edges hold the short node id.
      const nodeId = node.dataset.cls?.split('/').pop();
      if (!nodeId) return;
      // Only highlight edges in the same parent group (sibling edges)
      const parentGroup = node.parentElement?.closest('[data-cls]') || node.closest('svg');
      if (!parentGroup) return;
      parentGroup.querySelectorAll('.edge-path').forEach(path => {
        const from = path.dataset.from, to = path.dataset.to;
        const match = from === nodeId || to === nodeId || from === '@'+nodeId || to === '@'+nodeId;
        const edgeParentGroup = path.closest('[data-cls]') || path.closest('svg');
        if (edgeParentGroup !== parentGroup) return;
        if (match) showEdge(path.dataset.edge);
      });
    });
    canvasWrap.addEventListener('mouseout', e => {
      if (!e.target.closest('.edge-hit, .reg-node, .grp-node')) return;
      document.querySelectorAll('#canvas .edge-hl').forEach(el => el.classList.remove('edge-hl'));
    });
  }
}

// Perspectives that describe a flow: their light always runs along the arrows.
const FLOW_PERSPECTIVES = new Set(['data-flow', 'request-lifecycle', 'pipeline', 'orchestration']);

// Lights an edge: its path, its moving light and its label (class edge-hl on all three).
function showEdge(eid) {
  if (!eid) return;
  document.querySelectorAll(`#canvas [data-edge="${CSS.escape(eid)}"]`).forEach(el => el.classList.add('edge-hl'));
}

// ── rebuild canvas (depth change) ─────────────────────────
function rebuildCanvas() {
  const result = buildCanvas(classes, classesData, refsData);
  if (!result) return;
  canvasEl.innerHTML = result.html;
  svgW = result.W; svgH = result.H;
  applyTransform(); // re-sync label sizes / blur state
  postRender();
  paintGuideStep();
  // restore selected highlight only (no re-focus — user controls viewport after initial focus)
  if (selectedCls) {
    document.querySelectorAll(`[data-cls="${CSS.escape(selectedCls)}"]`)
      .forEach(el => el.classList.add('selected'));
  }
}

// ── nav sidebar tree ─────────────────────────────────────
function buildNavTree() {
  navList.innerHTML = '';
  if (!classes.length) return;

  const navOutCount = {}, navInCount = {};
  for (const c of classes) { navOutCount[c] = 0; navInCount[c] = 0; }
  for (const name of classes) {
    const out = refsData[name]?.outgoing || [];
    const targets = [...new Set(out.map(o => typeof o === 'string' ? o : (o.target_class || o)).filter(r => classes.includes(r)))];
    navOutCount[name] = targets.length;
    targets.forEach(r => { navInCount[r]++; });
  }

  // v2: if any perspective has children, use perspective nav with nested items
  const hasNested = Object.values(childrenByPerspective).some(c => c && c.length > 0);
  if (hasNested) {
    function addNavChildren(parentScopedPath, children, basePrefix) {
      children.forEach(function(child, j) {
        var isLast = j === children.length - 1;
        var childScoped = parentScopedPath + '/' + child;
        addNavItem(childScoped, basePrefix, isLast, customTitle(childScoped) ?? child);
        // Recurse: check if this child has sub-children in classesData
        var childData = classesData[child];
        if (childData && childData.children && childData.children.length > 0) {
          var subPrefix = basePrefix + (isLast ? '   ' : '│  ');
          addNavChildren(childScoped, childData.children, subPrefix);
        }
      });
    }
    originalPerspectives.forEach((persp, i) => {
      const isLastPersp = i === originalPerspectives.length - 1;
      const children = childrenByPerspective[persp] || [];
      const hasChildren = children.length > 0;

      // Create perspective row with expand/fold toggle
      const btn = document.createElement('button');
      btn.setAttribute('data-nav', persp);
      btn.className = 'nav-item nav-root';
      btn.onclick = () => { window.__openSb(persp); if(window.innerWidth<=768){var n=document.getElementById('nav-sidebar'),o=document.getElementById('mobile-overlay');if(n)n.classList.remove('mobile-open');if(o)o.classList.remove('show');} };

      if (hasChildren) {
        const toggle = document.createElement('span');
        toggle.className = 'nav-toggle';
        toggle.textContent = '▾';
        toggle.style.cssText = 'cursor:pointer;margin-right:6px;font-size:13px;color:inherit;user-select:none';
        toggle.onclick = function(e) {
          e.stopPropagation();
          const container = btn.nextElementSibling;
          if (!container) return;
          const collapsed = container.style.display === 'none';
          container.style.display = collapsed ? '' : 'none';
          toggle.textContent = collapsed ? '▾' : '▸';
        };
        btn.appendChild(toggle);
      }

      const labelSpan = document.createElement('span');
      labelSpan.textContent = customTitle(persp) ?? persp;
      btn.appendChild(labelSpan);
      navList.appendChild(btn);

      if (hasChildren) {
        const container = document.createElement('div');
        container.className = 'nav-persp-children';
        var childPrefix = isLastPersp ? '   ' : '│  ';
        // Collect children into container by temporarily redirecting addNavItem
        const origAppend = navList.appendChild.bind(navList);
        const tempItems = [];
        addNavChildren(persp, children, childPrefix);
        // Move the just-appended children from navList into container
        while (navList.lastChild && navList.lastChild !== btn) {
          container.insertBefore(navList.lastChild, container.firstChild);
        }
        navList.appendChild(container);
      }
    });
    return;
  }

  let roots = classes.filter(c => navInCount[c] === 0);
  if (roots.length === 0) {
    // Circular refs — pick class with most outgoing refs as root
    const maxOut = Math.max(...classes.map(c => navOutCount[c]));
    roots = classes.filter(c => navOutCount[c] === maxOut);
  }
  if (roots.length === classes.length) {
    classes.forEach(c => addNavItem(c, '', true));
    return;
  }

  const globalSeen = new Set();
  function renderNode(name, prefix, isLast) {
    if (globalSeen.has(name)) return;
    globalSeen.add(name);
    addNavItem(name, prefix, isLast);
    const out = (refsData[name]?.outgoing || [])
      .map(o => typeof o === 'string' ? o : (o.target_class || o))
      .filter(ref => classes.includes(ref) && !globalSeen.has(ref));
    out.forEach((ref, i) => {
      renderNode(ref, prefix + (isLast ? '   ' : '│  '), i === out.length - 1);
    });
  }
  roots.forEach((r, i) => renderNode(r, '', i === roots.length - 1));
}

function addNavItem(name, prefix, isLast, displayLabel) {
  const btn = document.createElement('button');
  btn.setAttribute('data-nav', name);
  btn.onclick = () => { window.__openSb(name); if(window.innerWidth<=768){var n=document.getElementById('nav-sidebar'),o=document.getElementById('mobile-overlay');if(n)n.classList.remove('mobile-open');if(o)o.classList.remove('show');} };

  if (prefix === '') {
    btn.className = 'nav-item nav-root';
    btn.textContent = displayLabel || name;
  } else {
    btn.className = 'nav-item';
    const pre = document.createElement('span');
    pre.className = 'nav-pre';
    // Each slot is 3 chars ("│  " or "   ")
    for (let i = 0; i < prefix.length; i += 3) {
      const slot = document.createElement('span');
      slot.className = 'nav-slot' + (prefix[i] === '│' ? ' nav-slot-line' : '');
      pre.appendChild(slot);
    }
    const conn = document.createElement('span');
    conn.className = 'nav-conn' + (isLast ? ' nav-conn-last' : '');
    pre.appendChild(conn);
    btn.appendChild(pre);
    const label = document.createElement('span');
    label.className = 'nav-label';
    label.textContent = displayLabel || name;
    btn.appendChild(label);
  }

  navList.appendChild(btn);
}

// ── guides ────────────────────────────────────────────────
// A guide (.prisme/.guides/<id>.yaml, served by /api/guides) walks through
// elements already on the canvas. It only opens elements, fades the rest and
// animates the edge of each step: all content stays in the elements.
const navGuides = document.getElementById('nav-guides');
const guideBar  = document.getElementById('guide-bar');
const sbStep    = document.getElementById('sb-step');
let guides = [];          // [{ id, guide, valid, issues }]
let activeGuide = null;   // one of guides
let guideStep = 0;

const guideKey = id => 'prisme-guide:' + id;
const GUIDE_DISMISS_KEY = 'prisme-guide-start-dismissed';
// Same arrows as parseFlowchart(): "a --> b", "a -->|label| b", ...
const STEP_EDGE = /^\s*@?([\w-]+)\s*(?:-->(?:\|[^|]*\|)?|--o|--x|---|-.->|==>|~~>)\s*@?([\w-]+)\s*$/;

// Guide text comes from .prisme/ (and later from AI answers): never let it run code.
function safeMarkdown(text) {
  return DOMPurify.sanitize(marked.parse(String(text)), {
    FORBID_TAGS: ['img', 'picture', 'audio', 'video', 'source', 'track', 'style', 'form', 'input', 'button',
      'textarea', 'select', 'iframe', 'object', 'embed', 'svg', 'math'],
    FORBID_ATTR: ['style'],
  });
}

function guideProgress(id) {
  const v = safeStorageGet(guideKey(id));
  if (v === 'done') return 'done';
  const n = parseInt(v || '', 10);
  return Number.isNaN(n) ? null : n;
}

const parentOf = elementPath => elementPath.split('/').slice(0, -1).join('/');
const guidePartsOf = g => [...new Set(g.steps.map(s => s.part).filter(Boolean))];
const stepsLabel = n => t(n === 1 ? 'stepsOne' : 'stepsOther', { n });

function partLabel(g, step) {
  const parts = guidePartsOf(g);
  if (!parts.length || !step.part) return '';
  return t('partOf', { i: parts.indexOf(step.part) + 1, n: parts.length, name: step.part });
}

// On the step's element the panel shows the step only; the full sheet otherwise.
function setGuidePanel(on) {
  sidebar.classList.toggle('guide-mode', on);
  if (!on) sidebar.classList.remove('show-full');
  syncFullToggle();
}

function syncFullToggle() {
  const btn = sbStep.querySelector('.sb-full-toggle');
  if (btn) btn.textContent = t(sidebar.classList.contains('show-full') ? 'hideFull' : 'showFull');
}

function closeMobileNav() {
  document.getElementById('nav-sidebar').classList.remove('mobile-open');
  document.getElementById('mobile-overlay').classList.remove('show');
}

function startFromNav(id) {
  startGuide(id);
  closeMobileNav();
}

// The Guides section of the left panel: the welcome guide on top, then the others.
function renderGuideList() {
  navGuides.innerHTML = '';
  navGuides.hidden = guides.length === 0;
  if (!guides.length) return;
  const head = document.createElement('div');
  head.className = 'nav-section';
  head.textContent = t('guides');
  navGuides.appendChild(head);

  const start = guides.find(g => g.valid && g.guide.start);
  if (start) navGuides.appendChild(startCard(start));
  const isAnswer = g => g.id.startsWith('ask-') && !!g.guide?.question;
  for (const g of guides) if (g !== start && !isAnswer(g)) navGuides.appendChild(guideItem(g));
  // Answers to the reader's questions, newest first, each with a delete button.
  const answers = guides.filter(isAnswer).reverse();
  if (answers.length) {
    const sub = document.createElement('div');
    sub.className = 'nav-section';
    sub.textContent = t('yourQuestions');
    navGuides.appendChild(sub);
    for (const g of answers) {
      const item = guideItem(g);
      if (PAGE_TOKEN) {
        const del = document.createElement('i');
        del.className = 'guide-del';
        del.textContent = '×';
        del.title = t('deleteAnswer');
        del.onclick = async e => {
          e.stopPropagation();
          const { ok } = await aiFetch('/api/v1/guides/' + encodeURIComponent(g.id), { method: 'DELETE' });
          if (!ok) return;
          if (activeGuide?.id === g.id) exitGuide();
          await loadGuidesIntoViewer();
        };
        item.appendChild(del);
      }
      navGuides.appendChild(item);
    }
  }
}

function guideMeta(g) {
  const parts = guidePartsOf(g).length;
  return [stepsLabel(g.steps.length), parts ? t(parts === 1 ? 'partsOne' : 'partsOther', { n: parts }) : '', g.duration]
    .filter(Boolean).join(' · ');
}

function startCard(g) {
  if (guideProgress(g.id) === 'done') {
    const btn = document.createElement('button');
    btn.className = 'guide-start-done';
    btn.textContent = t('replayWelcome');
    btn.onclick = () => startFromNav(g.id);
    return btn;
  }
  const card = document.createElement('div');
  card.className = 'guide-start';
  card.innerHTML = `
    <span class="gs-eyebrow">${esc(t('welcome'))}</span>
    <span class="gs-title">${esc(g.guide.title)}</span>
    <span class="gs-meta">${esc(guideMeta(g.guide))}</span>
    <button type="button">${esc(t('startBtn'))}</button>`;
  card.querySelector('button').onclick = () => startFromNav(g.id);
  return card;
}

function guideItem(g) {
  const btn = document.createElement('button');
  btn.className = 'guide-item' + (g.valid ? '' : ' invalid') + (activeGuide?.id === g.id ? ' active' : '');
  const check = document.createElement('i');
  check.className = 'guide-check';
  const title = document.createElement('span');
  title.textContent = g.guide ? g.guide.title : g.id;
  const info = document.createElement('small');
  if (!g.valid) {
    const first = g.issues.find(i => i.level === 'error');
    info.textContent = '!';
    btn.title = `${t('guideInvalid')}${first ? ` — ${first.step ? t('stepN', { n: first.step }) + ': ' : ''}${first.message}` : ''}`;
  } else {
    if (guideProgress(g.id) === 'done') check.textContent = '✓';
    info.textContent = String(g.guide.steps.length);
    btn.title = `${g.guide.title}\n${t(g.guide.kind === 'trace' ? 'kindTrace' : 'kindPath')} · ${guideMeta(g.guide)}`;
    btn.onclick = () => startFromNav(g.id);
  }
  btn.append(check, title, info);
  return btn;
}

function startGuide(id, step) {
  const g = guides.find(x => x.id === id);
  if (!g || !g.valid) return;
  activeGuide = g;
  const saved = guideProgress(id);
  const last = g.guide.steps.length - 1;
  guideStep = step ?? (typeof saved === 'number' && saved > 0 && saved < last ? saved : 0);
  guideStep = Math.max(0, Math.min(last, guideStep));
  showGuideStep();
}

function goToGuideStep(i) {
  if (!activeGuide || i < 0 || i >= activeGuide.guide.steps.length) return;
  const prev = activeGuide.guide.steps[guideStep].element;
  guideStep = i;
  showGuideStep(prev);
}

function nextGuideStep() {
  if (!activeGuide) return;
  if (guideStep < activeGuide.guide.steps.length - 1) goToGuideStep(guideStep + 1);
  else finishGuide();
}

function finishGuide() {
  safeStorageSet(guideKey(activeGuide.id), 'done');
  exitGuide();
}

function exitGuide() {
  activeGuide = null;
  clearTimeout(sparkTimer);
  sparkAnim?.cancel();
  paintGuideStep();
  guideBar.hidden = true;
  sbStep.hidden = true;
  setFilePanel(false);
  setGuidePanel(false);
  if (location.hash.startsWith('#guide=')) history.replaceState(null, '', location.pathname + location.search);
  renderGuideList();
}

// ── the guide's moving light ──
// After the view has moved to the new step, a light travels to its element:
// along the step's edge when it has one, otherwise in a straight line from
// the previous step's element. Then the element pulses once.
const guideSpark = document.getElementById('guide-spark');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
let sparkTimer = null, sparkAnim = null;

function drawnEl(cls) {
  for (let segs = cls.split('/'); segs.length; segs.pop()) {
    const el = document.querySelector(`#canvas [data-cls="${CSS.escape(segs.join('/'))}"]`);
    if (el) return el;
  }
  return null;
}

function centerOf(el) {
  const shape = el.querySelector(':scope > .grp-border, :scope > .nshape') || el;
  const r = shape.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

// Screen points along the step's edge, from the step already seen to the new element.
function edgePoints(step) {
  const m = step.edge && step.edge.match(STEP_EDGE);
  const parentEl = m && drawnEl(parentOf(step.element));
  if (!parentEl) return null;
  const path = [...parentEl.querySelectorAll('.edge-path')]
    .find(p => p.closest('[data-cls]') === parentEl && p.dataset.from === m[1] && p.dataset.to === m[2]);
  const ctm = path?.getScreenCTM();
  if (!ctm) return null;
  const len = path.getTotalLength(), pts = [];
  for (let k = 0; k <= 24; k++) {
    const p = path.getPointAtLength(len * k / 24);
    const s = new DOMPoint(p.x, p.y).matrixTransform(ctm);
    pts.push({ x: s.x, y: s.y });
  }
  // The arrow points away from the new element when the walk goes against it.
  return step.element.split('/').pop() === m[1] ? pts.reverse() : pts;
}

function flyGuideSpark(prevElement) {
  clearTimeout(sparkTimer);
  sparkAnim?.cancel();
  if (reducedMotion.matches || !activeGuide) return;
  const target = activeGuide.guide.steps[guideStep];
  // Wait for the view to finish moving (see __openSb and animateTo).
  sparkTimer = setTimeout(() => {
    if (!activeGuide || activeGuide.guide.steps[guideStep] !== target) return;
    const el = drawnEl(target.element);
    if (!el) return;
    const end = centerOf(el);
    let pts = edgePoints(target);
    if (!pts && prevElement && prevElement !== target.element) {
      const from = drawnEl(prevElement);
      if (from) pts = [centerOf(from), end];
    }
    const arrive = () => el.classList.add('guide-arrive');
    if (!pts) return arrive();
    sparkAnim = guideSpark.animate(
      pts.map((p, k) => ({ transform: `translate(${p.x}px, ${p.y}px)`, opacity: k === 0 || k === pts.length - 1 ? 0.2 : 1 })),
      { duration: 950, easing: 'ease-in-out' });
    sparkAnim.onfinish = arrive;
  }, 700);
}

// ── file panel ──
const filePanel = document.getElementById('file-panel');
const fileCache = new Map();

// The sidebar widens while it shows a file, so the code and its explanation sit side by side with the map.
function setFilePanel(on) {
  filePanel.hidden = !on;
  sidebar.classList.toggle('with-file', on);
}

async function showStepFile(step) {
  if (!step || !step.file) { setFilePanel(false); return; }
  const { path, lines } = step.file;
  let data = fileCache.get(path);
  if (!data) {
    data = await api('/api/v1/file?path=' + encodeURIComponent(path));
    if (data && !data.error) fileCache.set(path, data);
  }
  // The reader may have moved on while the file loaded.
  if (!activeGuide || activeGuide.guide.steps[guideStep] !== step) return;
  const m = /^(\d+)(?:-(\d+))?$/.exec(lines || '');
  const start = m ? +m[1] : 0, end = m ? +(m[2] || m[1]) : 0;
  const head = `<div class="fp-head"><span class="fp-path">${esc(path)}</span>${m ? `<span class="fp-lines">${esc(t('fileLines', { range: lines }))}</span>` : ''}<button type="button" class="ask-close" data-action="close-file" aria-label="${esc(t('fileClose'))}">×</button></div>`;
  if (!data || data.error) {
    filePanel.innerHTML = head + `<div class="fp-error">${esc(data?.error || '')}</div>`;
  } else {
    const rows = data.content.replace(/\n$/, '').split('\n').map((c, i) => {
      const n = i + 1;
      return `<div class="fp-line${n >= start && n <= end ? ' lit' : ''}" data-n="${n}"><span class="n">${n}</span><span class="c">${esc(c) || ' '}</span></div>`;
    }).join('');
    filePanel.innerHTML = head + `<div class="fp-body"><div class="fp-code">${rows}</div></div>`;
  }
  filePanel.setAttribute('aria-label', path);
  setFilePanel(true);
  const first = filePanel.querySelector('.fp-line.lit');
  if (first) {
    // A few lines of context above the lit ones.
    const body = filePanel.querySelector('.fp-body');
    body.scrollTop += first.getBoundingClientRect().top - body.getBoundingClientRect().top - 3 * first.offsetHeight;
  }
}

filePanel.addEventListener('click', e => {
  if (e.target.closest('[data-action="close-file"]')) setFilePanel(false);
});

// Opens the step's element, framing its parent diagram so the edge is in view.
function showGuideStep(prevElement) {
  const step = activeGuide.guide.steps[guideStep];
  sidebar.classList.remove('show-full');
  safeStorageSet(guideKey(activeGuide.id), String(guideStep));
  history.replaceState(null, '', `#guide=${encodeURIComponent(activeGuide.id)}&step=${guideStep + 1}`);
  renderGuideBar();
  window.__openSb(step.element, parentOf(step.element) || step.element);
  paintGuideStep();
  renderGuideList();
  flyGuideSpark(prevElement);
  showStepFile(step);
}

// Marks what the guide has walked so far. Safe to call after any re-render.
function paintGuideStep() {
  canvasWrap.classList.toggle('guiding', !!activeGuide);
  const marks = ['guide-lit', 'guide-cur', 'guide-anc', 'guide-in', 'guide-trail', 'guide-edge', 'guide-flow', 'guide-show', 'guide-arrive'];
  document.querySelectorAll(marks.map(m => '#canvas .' + m).join(','))
    .forEach(el => el.classList.remove(...marks));
  if (!activeGuide) return;

  const byCls = cls => document.querySelector(`#canvas [data-cls="${CSS.escape(cls)}"]`);
  // The canvas draws each nested element once: fall back to its nearest drawn parent.
  const drawn = cls => {
    for (let segs = cls.split('/'); segs.length; segs.pop()) {
      const el = byCls(segs.join('/'));
      if (el) return el;
    }
    return null;
  };
  activeGuide.guide.steps.slice(0, guideStep + 1).forEach((step, i) => {
    const parent = parentOf(step.element);
    const lit = [step.element, ...(step.focus || []).map(n => parent ? `${parent}/${n}` : n)];
    for (const cls of lit) {
      const el = cls === step.element ? drawn(cls) : byCls(cls);
      if (!el) continue;
      el.classList.add('guide-lit');
      if (i === guideStep && cls === step.element) el.classList.add('guide-cur');
      // A lit group lights everything inside it.
      el.querySelectorAll('.reg-node, .grp-node').forEach(n => n.classList.add('guide-lit'));
      el.querySelectorAll('.edge-path, .edge-label').forEach(n => n.classList.add('guide-in'));
    }
    // Keep the borders of the groups around the element.
    const segs = step.element.split('/');
    for (let k = 1; k < segs.length; k++) byCls(segs.slice(0, k).join('/'))?.classList.add('guide-anc');

    const m = step.edge && step.edge.match(STEP_EDGE);
    const parentEl = parent && byCls(parent);
    if (!m || !parentEl) return;
    parentEl.querySelectorAll('.edge-path').forEach(path => {
      if (path.closest('[data-cls]') !== parentEl) return;
      if (path.dataset.from !== m[1] || path.dataset.to !== m[2]) return;
      path.classList.add(i === guideStep ? 'guide-edge' : 'guide-trail');
      if (i !== guideStep) return;
      // The current edge also shows its label and its moving light.
      parentEl.querySelectorAll(`[data-edge="${CSS.escape(path.dataset.edge)}"]`).forEach(el => {
        if (el.classList.contains('edge-flow')) el.classList.add('guide-flow');
        if (el.classList.contains('edge-label')) el.classList.add('guide-show');
      });
    });
  });

  const g = activeGuide.guide, cur = g.steps[guideStep];
  sbStep.hidden = selectedCls !== cur.element;
  const head = [t('stepOf', { i: guideStep + 1, n: g.steps.length }), partLabel(g, cur)].filter(Boolean).join(' · ');
  const details = cur.details ? `<div class="sb-details">${safeMarkdown(cur.details)}</div>` : '';
  const full = sidebar.classList.contains('show-full');
  // `say` is plain text; only `code` spans are shown as code, after escaping.
  const say = esc(cur.say).replace(/`([^`]+)`/g, '<code>$1</code>');
  sbStep.innerHTML = `<b>${esc(head)}</b><p class="sb-say">${say}</p>${details}`
    + `<button type="button" class="sb-full-toggle">${esc(t(full ? 'hideFull' : 'showFull'))}</button>`;
  sbStep.querySelector('.sb-full-toggle').onclick = () => {
    sidebar.classList.toggle('show-full');
    syncFullToggle();
  };
  setGuidePanel(selectedCls === cur.element);
}

function renderGuideBar() {
  const g = activeGuide.guide, n = g.steps.length;
  // A small gap between parts shows where each one starts.
  const dots = g.steps.map((s, i) => {
    const gap = i > 0 && s.part && s.part !== g.steps[i - 1].part ? '<i class="gb-gap"></i>' : '';
    return `${gap}<button type="button" data-step="${i}" aria-label="${esc(t('stepN', { n: i + 1 }))}" class="${i < guideStep ? 'done' : i === guideStep ? 'cur' : ''}"></button>`;
  }).join('');
  const part = partLabel(g, g.steps[guideStep]);
  guideBar.innerHTML = `
    <span class="gb-kind">${esc(t(g.kind === 'trace' ? 'kindTrace' : 'kindPath'))}</span>
    <div class="gb-main">
      <div class="gb-title">${esc(g.title)}</div>
      ${part ? `<div class="gb-sub">${esc(part)}</div>` : ''}
      <div class="gb-steps">${dots}<span>${guideStep + 1} / ${n}</span></div>
    </div>
    <div class="gb-actions">
      <button type="button" class="gb-btn" data-act="prev" ${guideStep === 0 ? 'disabled' : ''}>${esc(t('back'))}</button>
      <button type="button" class="gb-btn primary" data-act="next">${esc(t(guideStep === n - 1 ? 'finish' : 'next'))}</button>
      <button type="button" class="gb-btn" data-act="exit">${esc(t('exitGuide'))}</button>
    </div>`;
  guideBar.hidden = false;
}

// Offers the project's start guide once, without opening it by itself.
function suggestStartGuide() {
  const g = guides.find(x => x.valid && x.guide.start);
  if (!g || activeGuide || guideProgress(g.id) === 'done' || safeStorageGet(GUIDE_DISMISS_KEY) === g.id) {
    if (!activeGuide) guideBar.hidden = true;
    return;
  }
  guideBar.innerHTML = `
    <span class="gb-kind">${esc(t('kindPath'))}</span>
    <div class="gb-main">
      <div class="gb-title">${esc(t('newHere'))} ${esc(g.guide.title)}</div>

guideBar.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.step !== undefined) return goToGuideStep(+btn.dataset.step);
