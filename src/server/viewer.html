}
window.closeSidebar=closeSidebar;

// ── build full canvas SVG ─────────────────────────────────
function buildCanvas(classes, classesData, refsData) {
  _expandedGlobal = new Set(); // reset per render
  // Find top-level classes: those with no incoming @refs from other classes
  // Build outgoing ref counts to handle circular references
  const outCount = {}; // cls -> number of outgoing @refs to other classes
  const inCount = {};  // cls -> number of incoming @refs from other classes
  for (const cls of classes) { outCount[cls] = 0; inCount[cls] = 0; }
  for (const cls of classes) {
    const diagram = classesData[cls]?.diagram || '';
    const refs = [...new Set([...diagram.matchAll(/@([\w-]+)/g)].map(m=>m[1]).filter(r => classes.includes(r)))];
    outCount[cls] = refs.length;
    refs.forEach(r => { inCount[r]++; });
  }
  // Top-level = not referenced, OR referenced but has more outgoing refs than any referrer (cycle breaker)
  let topLevel = classes.filter(c => inCount[c] === 0);
  if (!topLevel.length) {
    // All classes have incoming refs (circular). Pick the one with most outgoing refs as root.
    const maxOut = Math.max(...classes.map(c => outCount[c]));
    topLevel = classes.filter(c => outCount[c] === maxOut);
  }
  const roots = topLevel;

  // Render each top-level group
  const groups = [];
  for (const cls of roots) {
    const g = renderGroup(cls, classesData, classes, 0);
    if (g) groups.push({ cls, ...g });
  }
  if (!groups.length) return null;

  // Grid layout — ceil(sqrt(N)) columns for balanced aspect ratio
  const COLS = Math.max(1, Math.ceil(Math.sqrt(groups.length)));
  const GAP_X = 70, GAP_Y = 90, OUTER_PAD = 60;

  // Assign grid positions
  groups.forEach((g, i) => { g._col = i % COLS; g._row = Math.floor(i / COLS); });
  const numRows = Math.ceil(groups.length / COLS);

  // Column widths = max group width in that column
  const colW = Array.from({length: COLS}, (_, c) =>
    Math.max(...groups.filter(g => g._col === c).map(g => g.W)));
  // Row heights = max group height in that row
  const rowH = Array.from({length: numRows}, (_, r) =>
    Math.max(...groups.filter(g => g._row === r).map(g => g.H)));

  // Compute offsets
  const colX = colW.reduce((acc, w, i) => { acc.push(i===0 ? 0 : acc[i-1]+colW[i-1]+GAP_X); return acc; }, []);
  const rowY = rowH.reduce((acc, h, i) => { acc.push(i===0 ? 0 : acc[i-1]+rowH[i-1]+GAP_Y); return acc; }, []);

  const totalW = colX[COLS-1] + colW[COLS-1];
  const totalH = rowY[numRows-1] + rowH[numRows-1];
  const canvasW = r1(totalW + OUTER_PAD*2);
  const canvasH = r1(totalH + OUTER_PAD*2);

  const th = theme();
  let innerSVG = '';
  for (const g of groups) {
    const tx = r1(OUTER_PAD + colX[g._col]);
    const ty = r1(OUTER_PAD + rowY[g._row]);
    innerSVG += `<g class="grp-node" data-cls="${esc(g.cls)}" data-depth="0" transform="translate(${tx},${ty})" onclick="event.stopPropagation();window.__openSb('${esc(g.cls)}')">`;
    innerSVG += `<rect class="grp-border" width="${g.W}" height="${g.H}" rx="8"
      fill="${th.groupFill}" stroke="${th.groupStroke}" stroke-width="2"/>`;
    const _lblW = tw(displayTitle(g.cls), '600 10px "Plus Jakarta Sans",Inter,system-ui') + 14;
    innerSVG += `<rect class="grp-label-top grp-label-bg" x="6" y="-10" width="${_lblW}" height="20" rx="2" fill="${th.groupFill}" opacity="1"/>`;
    innerSVG += `<text class="grp-label-top" x="12" y="3" font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="10" font-weight="600"
      fill="${th.grpLabelFill}" letter-spacing="0.05em">${esc(displayTitle(g.cls))}</text>`;
    innerSVG += `<g class="grp-inner">${g.svgContent}</g>`;
    if (g.labelOverlay) innerSVG += `<g class="grp-sub-labels">${g.labelOverlay}</g>`;
    innerSVG += `<text class="grp-label-center" x="${r1(g.W/2)}" y="${r1(g.H/2)}" text-anchor="middle" dominant-baseline="central"
      font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="10" font-weight="600" fill="${th.grpLabelCenterFill}" letter-spacing="0.05em">${esc(displayTitle(g.cls))}</text>`;
    innerSVG += `</g>`;
  }

  return { html: `<svg width="${canvasW}" height="${canvasH}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">${innerSVG}</svg>`, W: canvasW, H: canvasH };
}

// ── post-render: glow filter + edge hover delegation ──────
let _hoverListenerAttached = false;
function postRender() {
  // Insert glow filter into the first SVG's <defs> in #canvas
  const svg = canvasEl.querySelector('svg');
  if (svg) {
    let defs = svg.querySelector('defs');
    if (!defs) { defs = document.createElementNS('http://www.w3.org/2000/svg','defs'); svg.prepend(defs); }
    // Remove existing glow filter if present (from prior render)
    const existing = defs.querySelector('#glow');
    if (existing) existing.remove();
    defs.insertAdjacentHTML('beforeend',
      '<filter id="glow"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>' +
      '<feFlood flood-color="#818cf8" flood-opacity="0.4" result="color"/>' +
      '<feComposite in="color" in2="blur" operator="in" result="shadow"/>' +
      '<feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'
    );
  }

  // Attach edge-hover event delegation once (survives innerHTML replacements on canvasEl)
  if (!_hoverListenerAttached) {
    _hoverListenerAttached = true;
    canvasWrap.addEventListener('mouseover', e => {
      const node = e.target.closest('.reg-node, .grp-node');
      if (!node) return;
      const nodeId = node.dataset.cls;
      if (!nodeId) return;
      // Only highlight edges in the same parent group (sibling edges)
      const parentGroup = node.parentElement?.closest('[data-cls]') || node.closest('svg');
      if (!parentGroup) return;
      parentGroup.querySelectorAll('.edge-path').forEach(path => {
        const from = path.dataset.from, to = path.dataset.to;
        const match = from === nodeId || to === nodeId || from === '@'+nodeId || to === '@'+nodeId;
        const edgeParentGroup = path.closest('[data-cls]') || path.closest('svg');
        if (edgeParentGroup !== parentGroup) return;
        if (match) {
          path.classList.add('edge-hl');
        }
      });
    });
    canvasWrap.addEventListener('mouseout', e => {
      const node = e.target.closest('.reg-node, .grp-node');
      if (!node) return;
      document.querySelectorAll('#canvas .edge-path.edge-hl').forEach(path => {
        path.classList.remove('edge-hl');
      });
    });
  }
}

// ── rebuild canvas (depth change) ─────────────────────────
function rebuildCanvas() {
  const result = buildCanvas(classes, classesData, refsData);
  if (!result) return;
  canvasEl.innerHTML = result.html;
  svgW = result.W; svgH = result.H;
  applyTransform(); // re-sync label sizes / blur state
  postRender();
  paintGuideStep();
  // restore selected highlight only (no re-focus — user controls viewport after initial focus)
  if (selectedCls) {
    document.querySelectorAll(`[data-cls="${CSS.escape(selectedCls)}"]`)
      .forEach(el => el.classList.add('selected'));
  }
}

// ── nav sidebar tree ─────────────────────────────────────
function buildNavTree() {
  navList.innerHTML = '';
  if (!classes.length) return;

  const navOutCount = {}, navInCount = {};
  for (const c of classes) { navOutCount[c] = 0; navInCount[c] = 0; }
  for (const name of classes) {
    const out = refsData[name]?.outgoing || [];
    const targets = [...new Set(out.map(o => typeof o === 'string' ? o : (o.target_class || o)).filter(r => classes.includes(r)))];
    navOutCount[name] = targets.length;
    targets.forEach(r => { navInCount[r]++; });
  }

  // v2: if any perspective has children, use perspective nav with nested items
  const hasNested = Object.values(childrenByPerspective).some(c => c && c.length > 0);
  if (hasNested) {
    function addNavChildren(parentScopedPath, children, basePrefix) {
      children.forEach(function(child, j) {
        var isLast = j === children.length - 1;
        var childScoped = parentScopedPath + '/' + child;
        addNavItem(childScoped, basePrefix, isLast, customTitle(childScoped) ?? child);
        // Recurse: check if this child has sub-children in classesData
        var childData = classesData[child];
        if (childData && childData.children && childData.children.length > 0) {
          var subPrefix = basePrefix + (isLast ? '   ' : '│  ');
          addNavChildren(childScoped, childData.children, subPrefix);
        }
      });
    }
    originalPerspectives.forEach((persp, i) => {
      const isLastPersp = i === originalPerspectives.length - 1;
      const children = childrenByPerspective[persp] || [];
      const hasChildren = children.length > 0;

      // Create perspective row with expand/fold toggle
      const btn = document.createElement('button');
      btn.setAttribute('data-nav', persp);
      btn.className = 'nav-item nav-root';
      btn.onclick = () => { window.__openSb(persp); if(window.innerWidth<=768){var n=document.getElementById('nav-sidebar'),o=document.getElementById('mobile-overlay');if(n)n.classList.remove('mobile-open');if(o)o.classList.remove('show');} };

      if (hasChildren) {
        const toggle = document.createElement('span');
        toggle.className = 'nav-toggle';
        toggle.textContent = '▾';
        toggle.style.cssText = 'cursor:pointer;margin-right:6px;font-size:13px;color:inherit;user-select:none';
        toggle.onclick = function(e) {
          e.stopPropagation();
          const container = btn.nextElementSibling;
          if (!container) return;
          const collapsed = container.style.display === 'none';
          container.style.display = collapsed ? '' : 'none';
          toggle.textContent = collapsed ? '▾' : '▸';
        };
        btn.appendChild(toggle);
      }

      const labelSpan = document.createElement('span');
      labelSpan.textContent = customTitle(persp) ?? persp;
      btn.appendChild(labelSpan);
      navList.appendChild(btn);

      if (hasChildren) {
        const container = document.createElement('div');
        container.className = 'nav-persp-children';
        var childPrefix = isLastPersp ? '   ' : '│  ';
        // Collect children into container by temporarily redirecting addNavItem
        const origAppend = navList.appendChild.bind(navList);
        const tempItems = [];
        addNavChildren(persp, children, childPrefix);
        // Move the just-appended children from navList into container
        while (navList.lastChild && navList.lastChild !== btn) {
          container.insertBefore(navList.lastChild, container.firstChild);
        }
        navList.appendChild(container);
      }
    });
    return;
  }

  let roots = classes.filter(c => navInCount[c] === 0);
  if (roots.length === 0) {
    // Circular refs — pick class with most outgoing refs as root
    const maxOut = Math.max(...classes.map(c => navOutCount[c]));
    roots = classes.filter(c => navOutCount[c] === maxOut);
  }
  if (roots.length === classes.length) {
    classes.forEach(c => addNavItem(c, '', true));
    return;
  }

  const globalSeen = new Set();
  function renderNode(name, prefix, isLast) {
    if (globalSeen.has(name)) return;
    globalSeen.add(name);
    addNavItem(name, prefix, isLast);
    const out = (refsData[name]?.outgoing || [])
      .map(o => typeof o === 'string' ? o : (o.target_class || o))
      .filter(ref => classes.includes(ref) && !globalSeen.has(ref));
    out.forEach((ref, i) => {
      renderNode(ref, prefix + (isLast ? '   ' : '│  '), i === out.length - 1);
    });
  }
  roots.forEach((r, i) => renderNode(r, '', i === roots.length - 1));
}

function addNavItem(name, prefix, isLast, displayLabel) {
  const btn = document.createElement('button');
  btn.setAttribute('data-nav', name);
  btn.onclick = () => { window.__openSb(name); if(window.innerWidth<=768){var n=document.getElementById('nav-sidebar'),o=document.getElementById('mobile-overlay');if(n)n.classList.remove('mobile-open');if(o)o.classList.remove('show');} };

  if (prefix === '') {
    btn.className = 'nav-item nav-root';
    btn.textContent = displayLabel || name;
  } else {
    btn.className = 'nav-item';
    const pre = document.createElement('span');
    pre.className = 'nav-pre';
    // Each slot is 3 chars ("│  " or "   ")
    for (let i = 0; i < prefix.length; i += 3) {
      const slot = document.createElement('span');
      slot.className = 'nav-slot' + (prefix[i] === '│' ? ' nav-slot-line' : '');
      pre.appendChild(slot);
    }
    const conn = document.createElement('span');
    conn.className = 'nav-conn' + (isLast ? ' nav-conn-last' : '');
    pre.appendChild(conn);
    btn.appendChild(pre);
    const label = document.createElement('span');
    label.className = 'nav-label';
    label.textContent = displayLabel || name;
    btn.appendChild(label);
  }

  navList.appendChild(btn);
}

// ── guides ────────────────────────────────────────────────
// A guide (.omm/.guides/<id>.yaml, served by /api/guides) walks through
// elements already on the canvas. It only opens elements, fades the rest and
// animates the edge of each step: all content stays in the elements.
const navGuides = document.getElementById('nav-guides');
const guideBar  = document.getElementById('guide-bar');
const sbStep    = document.getElementById('sb-step');
let guides = [];          // [{ id, guide, valid, issues }]
let activeGuide = null;   // one of guides
let guideStep = 0;

const guideKey = id => 'omm-guide:' + id;
const GUIDE_DISMISS_KEY = 'omm-guide-start-dismissed';
// Same arrows as parseFlowchart(): "a --> b", "a -->|label| b", ...
const STEP_EDGE = /^\s*@?([\w-]+)\s*(?:-->(?:\|[^|]*\|)?|--o|--x|---|-.->|==>|~~>)\s*@?([\w-]+)\s*$/;

// Guide text comes from .omm/ (and later from AI answers): never let it run code.
function safeMarkdown(text) {
  return DOMPurify.sanitize(marked.parse(String(text)), {
    FORBID_TAGS: ['img', 'picture', 'audio', 'video', 'source', 'track', 'style', 'form', 'input', 'button',
      'textarea', 'select', 'iframe', 'object', 'embed', 'svg', 'math'],
    FORBID_ATTR: ['style'],
  });
}

function guideProgress(id) {
  const v = safeStorageGet(guideKey(id));
  if (v === 'done') return 'done';
  const n = parseInt(v || '', 10);
  return Number.isNaN(n) ? null : n;
}

const parentOf = elementPath => elementPath.split('/').slice(0, -1).join('/');
const guidePartsOf = g => [...new Set(g.steps.map(s => s.part).filter(Boolean))];
const stepsLabel = n => t(n === 1 ? 'stepsOne' : 'stepsOther', { n });

function partLabel(g, step) {
  const parts = guidePartsOf(g);
  if (!parts.length || !step.part) return '';
  return t('partOf', { i: parts.indexOf(step.part) + 1, n: parts.length, name: step.part });
}

// On the step's element the panel shows the step only; the full sheet otherwise.
function setGuidePanel(on) {
  sidebar.classList.toggle('guide-mode', on);
  if (!on) sidebar.classList.remove('show-full');
  syncFullToggle();
}

function syncFullToggle() {
  const btn = sbStep.querySelector('.sb-full-toggle');
  if (btn) btn.textContent = t(sidebar.classList.contains('show-full') ? 'hideFull' : 'showFull');
}

function closeMobileNav() {
  document.getElementById('nav-sidebar').classList.remove('mobile-open');
  document.getElementById('mobile-overlay').classList.remove('show');
}

function startFromNav(id) {
  startGuide(id);
  closeMobileNav();
}

// The Guides section of the left panel: the welcome guide on top, then the others.
function renderGuideList() {
  navGuides.innerHTML = '';
  navGuides.hidden = guides.length === 0;
  if (!guides.length) return;
  const head = document.createElement('div');
  head.className = 'nav-section';
  head.textContent = t('guides');
  navGuides.appendChild(head);

  const start = guides.find(g => g.valid && g.guide.start);
  if (start) navGuides.appendChild(startCard(start));
  for (const g of guides) if (g !== start) navGuides.appendChild(guideItem(g));
}

function guideMeta(g) {
  const parts = guidePartsOf(g).length;
  return [stepsLabel(g.steps.length), parts ? t(parts === 1 ? 'partsOne' : 'partsOther', { n: parts }) : '', g.duration]
    .filter(Boolean).join(' · ');
}

function startCard(g) {
  if (guideProgress(g.id) === 'done') {
    const btn = document.createElement('button');
    btn.className = 'guide-start-done';
    btn.textContent = t('replayWelcome');
    btn.onclick = () => startFromNav(g.id);
    return btn;
  }
  const card = document.createElement('div');
  card.className = 'guide-start';
  card.innerHTML = `
    <span class="gs-eyebrow">${esc(t('welcome'))}</span>
    <span class="gs-title">${esc(g.guide.title)}</span>
    <span class="gs-meta">${esc(guideMeta(g.guide))}</span>
    <button type="button">${esc(t('startBtn'))}</button>`;
  card.querySelector('button').onclick = () => startFromNav(g.id);
  return card;
}

function guideItem(g) {
  const btn = document.createElement('button');
  btn.className = 'guide-item' + (g.valid ? '' : ' invalid') + (activeGuide?.id === g.id ? ' active' : '');
  const check = document.createElement('i');
  check.className = 'guide-check';
  const title = document.createElement('span');
  title.textContent = g.guide ? g.guide.title : g.id;
  const info = document.createElement('small');
  if (!g.valid) {
    const first = g.issues.find(i => i.level === 'error');
    info.textContent = '!';
    btn.title = `${t('guideInvalid')}${first ? ` — ${first.step ? t('stepN', { n: first.step }) + ': ' : ''}${first.message}` : ''}`;
  } else {
    if (guideProgress(g.id) === 'done') check.textContent = '✓';
    info.textContent = String(g.guide.steps.length);
    btn.title = `${g.guide.title}\n${t(g.guide.kind === 'trace' ? 'kindTrace' : 'kindPath')} · ${guideMeta(g.guide)}`;
    btn.onclick = () => startFromNav(g.id);
  }
  btn.append(check, title, info);
  return btn;
}

function startGuide(id, step) {
  const g = guides.find(x => x.id === id);
  if (!g || !g.valid) return;
  activeGuide = g;
  const saved = guideProgress(id);
  const last = g.guide.steps.length - 1;
  guideStep = step ?? (typeof saved === 'number' && saved > 0 && saved < last ? saved : 0);
  guideStep = Math.max(0, Math.min(last, guideStep));
  showGuideStep();
}

function goToGuideStep(i) {
  if (!activeGuide || i < 0 || i >= activeGuide.guide.steps.length) return;
  guideStep = i;
  showGuideStep();
}

function nextGuideStep() {
  if (!activeGuide) return;
  if (guideStep < activeGuide.guide.steps.length - 1) goToGuideStep(guideStep + 1);
  else finishGuide();
}

function finishGuide() {
  safeStorageSet(guideKey(activeGuide.id), 'done');
  exitGuide();
}

function exitGuide() {
  activeGuide = null;
  paintGuideStep();
  guideBar.hidden = true;
  sbStep.hidden = true;
  setGuidePanel(false);
  if (location.hash.startsWith('#guide=')) history.replaceState(null, '', location.pathname + location.search);
  renderGuideList();
}

// Opens the step's element, framing its parent diagram so the edge is in view.
function showGuideStep() {
  const step = activeGuide.guide.steps[guideStep];
  sidebar.classList.remove('show-full');
  safeStorageSet(guideKey(activeGuide.id), String(guideStep));
  history.replaceState(null, '', `#guide=${encodeURIComponent(activeGuide.id)}&step=${guideStep + 1}`);
  renderGuideBar();
  window.__openSb(step.element, parentOf(step.element) || step.element);
  paintGuideStep();
  renderGuideList();
}

// Marks what the guide has walked so far. Safe to call after any re-render.
function paintGuideStep() {
  canvasWrap.classList.toggle('guiding', !!activeGuide);
  const marks = ['guide-lit', 'guide-cur', 'guide-anc', 'guide-in', 'guide-trail', 'guide-edge'];
  document.querySelectorAll(marks.map(m => '#canvas .' + m).join(','))
    .forEach(el => el.classList.remove(...marks));
  if (!activeGuide) return;

  const byCls = cls => document.querySelector(`#canvas [data-cls="${CSS.escape(cls)}"]`);
  // The canvas draws each nested element once: fall back to its nearest drawn parent.
  const drawn = cls => {
    for (let segs = cls.split('/'); segs.length; segs.pop()) {
      const el = byCls(segs.join('/'));
      if (el) return el;
    }
    return null;
  };
  activeGuide.guide.steps.slice(0, guideStep + 1).forEach((step, i) => {
    const parent = parentOf(step.element);
    const lit = [step.element, ...(step.focus || []).map(n => parent ? `${parent}/${n}` : n)];
    for (const cls of lit) {
      const el = cls === step.element ? drawn(cls) : byCls(cls);
      if (!el) continue;
      el.classList.add('guide-lit');
      if (i === guideStep && cls === step.element) el.classList.add('guide-cur');
      // A lit group lights everything inside it.
      el.querySelectorAll('.reg-node, .grp-node').forEach(n => n.classList.add('guide-lit'));
      el.querySelectorAll('.edge-path, .edge-label').forEach(n => n.classList.add('guide-in'));
    }
    // Keep the borders of the groups around the element.
    const segs = step.element.split('/');
    for (let k = 1; k < segs.length; k++) byCls(segs.slice(0, k).join('/'))?.classList.add('guide-anc');

    const m = step.edge && step.edge.match(STEP_EDGE);
    const parentEl = parent && byCls(parent);
    if (!m || !parentEl) return;
    parentEl.querySelectorAll('.edge-path').forEach(path => {
      if (path.closest('[data-cls]') !== parentEl) return;
      if (path.dataset.from !== m[1] || path.dataset.to !== m[2]) return;
      path.classList.add(i === guideStep ? 'guide-edge' : 'guide-trail');
    });
  });

  const g = activeGuide.guide, cur = g.steps[guideStep];
  sbStep.hidden = selectedCls !== cur.element;
  const head = [t('stepOf', { i: guideStep + 1, n: g.steps.length }), partLabel(g, cur)].filter(Boolean).join(' · ');
  const details = cur.details ? `<div class="sb-details">${safeMarkdown(cur.details)}</div>` : '';
  const full = sidebar.classList.contains('show-full');
  // `say` is plain text; only `code` spans are shown as code, after escaping.
  const say = esc(cur.say).replace(/`([^`]+)`/g, '<code>$1</code>');
  sbStep.innerHTML = `<b>${esc(head)}</b><p class="sb-say">${say}</p>${details}`
    + `<button type="button" class="sb-full-toggle">${esc(t(full ? 'hideFull' : 'showFull'))}</button>`;
  sbStep.querySelector('.sb-full-toggle').onclick = () => {
    sidebar.classList.toggle('show-full');
    syncFullToggle();
  };
  setGuidePanel(selectedCls === cur.element);
}

function renderGuideBar() {
  const g = activeGuide.guide, n = g.steps.length;
  // A small gap between parts shows where each one starts.
  const dots = g.steps.map((s, i) => {
    const gap = i > 0 && s.part && s.part !== g.steps[i - 1].part ? '<i class="gb-gap"></i>' : '';
    return `${gap}<button type="button" data-step="${i}" aria-label="${esc(t('stepN', { n: i + 1 }))}" class="${i < guideStep ? 'done' : i === guideStep ? 'cur' : ''}"></button>`;
  }).join('');
  const part = partLabel(g, g.steps[guideStep]);
  guideBar.innerHTML = `
    <span class="gb-kind">${esc(t(g.kind === 'trace' ? 'kindTrace' : 'kindPath'))}</span>
    <div class="gb-main">
      <div class="gb-title">${esc(g.title)}</div>
      ${part ? `<div class="gb-sub">${esc(part)}</div>` : ''}
      <div class="gb-steps">${dots}<span>${guideStep + 1} / ${n}</span></div>
    </div>
    <div class="gb-actions">
      <button type="button" class="gb-btn" data-act="prev" ${guideStep === 0 ? 'disabled' : ''}>${esc(t('back'))}</button>
      <button type="button" class="gb-btn primary" data-act="next">${esc(t(guideStep === n - 1 ? 'finish' : 'next'))}</button>
      <button type="button" class="gb-btn" data-act="exit">${esc(t('exitGuide'))}</button>
    </div>`;
  guideBar.hidden = false;
}

// Offers the project's start guide once, without opening it by itself.
function suggestStartGuide() {
  const g = guides.find(x => x.valid && x.guide.start);
  if (!g || activeGuide || guideProgress(g.id) === 'done' || safeStorageGet(GUIDE_DISMISS_KEY) === g.id) {
    if (!activeGuide) guideBar.hidden = true;
    return;
  }
  guideBar.innerHTML = `
    <span class="gb-kind">${esc(t('kindPath'))}</span>
    <div class="gb-main">
      <div class="gb-title">${esc(t('newHere'))} ${esc(g.guide.title)}</div>
      <div class="gb-sub">${esc(guideMeta(g.guide))}</div>
    </div>
    <div class="gb-actions">
      <button type="button" class="gb-btn primary" data-act="start" data-id="${esc(g.id)}">${esc(t('startBtn'))}</button>
      <button type="button" class="gb-close" data-act="dismiss" data-id="${esc(g.id)}" aria-label="${esc(t('close'))}">×</button>
    </div>`;
  guideBar.hidden = false;
}

guideBar.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  if (btn.dataset.step !== undefined) return goToGuideStep(+btn.dataset.step);
  const act = btn.dataset.act;
  if (act === 'prev') goToGuideStep(guideStep - 1);
  if (act === 'next') nextGuideStep();
  if (act === 'exit') { exitGuide(); closeSidebar(); }
  if (act === 'start') startGuide(btn.dataset.id);
  if (act === 'dismiss') { safeStorageSet(GUIDE_DISMISS_KEY, btn.dataset.id); guideBar.hidden = true; }
});

// Called by init(), on first load and after each live reload.
async function loadGuidesIntoViewer() {
  const data = await api('/api/guides');
  guides = Array.isArray(data) ? data : [];
  if (activeGuide) {
    const again = guides.find(g => g.id === activeGuide.id && g.valid);
    if (!again) return exitGuide();
    activeGuide = again;
    guideStep = Math.min(guideStep, again.guide.steps.length - 1);
    // A reload (scan, AI edit) must not move the view or the selection.
    renderGuideBar();
    paintGuideStep();
    renderGuideList();
    return;
  }
  renderGuideList();
  if (startLinkedGuide(60)) return;
  suggestStartGuide();
}

// #guide=<id>&step=<n> opens a guide at a step; returns whether it did.
function startLinkedGuide(delay = 0) {
  const link = new URLSearchParams(location.hash.slice(1));
  const linked = link.get('guide');
  if (!linked || !guides.some(g => g.id === linked && g.valid)) return false;
  const step = Math.max(0, (parseInt(link.get('step') || '1', 10) || 1) - 1);
  setTimeout(() => startGuide(linked, step), delay);
  return true;
}
// A link pasted into an open viewer changes only the hash.
window.addEventListener('hashchange', () => startLinkedGuide());

// ── nested element support ────────────────────────────────
var childrenByPerspective = {};
var originalPerspectives = []; // top-level only, before short names pollute classes

async function loadNodeData(perspective, childName) {
  var key = perspective + '/' + childName;
  if (classesData[key]) return classesData[key];
  var data = await api('/api/class/' + perspective + '/node/' + childName);
  if (data && !data.error) {
    classesData[key] = data;
    // Short name in classesData ONLY for renderGroup ref lookup
    // Do NOT add to classes array — only perspectives belong there
    classesData[childName] = data;
    // Also load this element's children (depth 2+)
    if (data.children && data.children.length > 0) {
      var subLoads = [];
      for (var sub of data.children) {
        subLoads.push(loadSubNodeData(perspective, childName + '/' + sub, sub));
      }
      await Promise.all(subLoads);
    }
  }
  return data;
}

async function loadSubNodeData(perspective, subPath, shortName) {
  if (classesData[perspective + '/' + subPath]) return;
  var data = await api('/api/class/' + perspective + '/node/' + subPath);
  if (data && !data.error) {
    classesData[perspective + '/' + subPath] = data;
    classesData[shortName] = data;
    // Recurse for deeper children
    if (data.children && data.children.length > 0) {
      var deepLoads = [];
      for (var sub of data.children) {
        deepLoads.push(loadSubNodeData(perspective, subPath + '/' + sub, sub));
      }
      await Promise.all(deepLoads);
    }
  }
}

// ── init ──────────────────────────────────────────────────
async function init() {
  applyTheme();
  const [config, list] = await Promise.all([api('/api/config'), api('/api/classes')]);
  setLanguage(config.language);
  classes = Array.isArray(list) ? list : [];
  if (!classes.length) {
    const hint = esc(I18N[lang].emptyHint).replace('{cmd}', '<code>/omm-scan</code>');
    canvasEl.innerHTML=`<div class="empty-state" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%)"><p>${esc(t('emptyTitle'))}<br>${hint}</p></div>`;
    return;
  }
  const [da,ra,na] = await Promise.all([
    Promise.all(classes.map(c=>api(`/api/class/${c}`))),
    Promise.all(classes.map(c=>api(`/api/class/${c}/refs`))),
    Promise.all(classes.map(c=>api(`/api/class/${c}/nodes`))),
  ]);
  originalPerspectives = [...classes];
  classes.forEach((c,i)=>{
    classesData[c]=da[i];
    refsData[c]=ra[i];
    childrenByPerspective[c]=(na[i]&&na[i].children)||[];
  });

  // Pre-load nested element data for all children
  var nodeLoads = [];
  for (var persp of Object.keys(childrenByPerspective)) {
    for (var child of childrenByPerspective[persp]) {
      nodeLoads.push(loadNodeData(persp, child));
    }
  }
  await Promise.all(nodeLoads);

  // Set project name and build nav tree
  var projName = window.__projectName || 'omm';
  navTitle.textContent = projName;
  var mobileTitle = document.getElementById('mobile-title');
  if (mobileTitle) mobileTitle.textContent = projName;
  buildNavTree();

  const result = buildCanvas(originalPerspectives, classesData, refsData);
  if (result) {
    canvasEl.innerHTML = result.html;
    svgW = result.W; svgH = result.H;
  }
  postRender();
  paintGuideStep();
  if (!activeGuide) requestAnimationFrame(centerView);
  await loadGuidesIntoViewer();

  // Cloud mode: notify parent frame of available classes
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'classes-loaded', classes: classes, refs: refsData }, '*');
  }

  // Cloud mode: listen for parent frame messages
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'select-class') {
      var className = e.data.className;
      if (typeof window.__openSb === 'function') {
        window.__openSb(className);
      }
    }
  });
}

window.toggleMobileNav = function() {
  const nav = document.getElementById('nav-sidebar');
  const overlay = document.getElementById('mobile-overlay');
  const isOpen = nav.classList.contains('mobile-open');
  nav.classList.toggle('mobile-open', !isOpen);
  overlay.classList.toggle('show', !isOpen);
};

function setupLiveReload() {
  if (!window.EventSource) return;

  try {
    const sse = new EventSource('/events');
    sse.addEventListener('change', async () => {
      const sel = selectedCls;
      await init();
      if (sel && classes.includes(sel)) window.__openSb(sel);
    });
  } catch {}
}

setupLiveReload();
init();
</script>
